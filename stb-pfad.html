<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Echo StB-Pfad</title>
<meta name="theme-color" content="#F2F3EF">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="tools.css">
<script src="theme.js"></script>
<script src="kurator.js"></script>
<script src="eule.js" defer></script>
<link rel="stylesheet" href="theme.css">
<style>
.phase{display:flex;gap:4px}
.phase i{flex:1;height:5px;border-radius:9px;background:var(--surface-2)}
.phase i.on{background:var(--calm)}
.phase i.cur{background:var(--gold)}
.sv{background:var(--surface-2);border-radius:12px;padding:12px 14px;line-height:1.55}
.step{border-left:3px solid var(--line);padding:4px 0 4px 12px;display:grid;gap:6px}
.step.open{border-color:var(--calm)}
.ans{background:var(--calm-soft, rgba(27,129,115,.12));border-radius:10px;padding:10px 12px;line-height:1.5}
.schema{margin:0;padding-left:20px;display:grid;gap:4px;line-height:1.45}
.core p{margin:0 0 10px;line-height:1.6}
.norm{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted);white-space:nowrap}
#app textarea,#app input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#app textarea{min-height:70px;resize:vertical}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.conf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mod{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mod.lock{opacity:.5}
.why{border-left:3px solid var(--gold);padding-left:12px;line-height:1.55}
details summary{cursor:pointer;font-weight:600}
.big{font-size:28px}
</style>
</head>
<body>
<main id="app"></main>
<script src="tools-common.js"></script>
<script src="stb-pfad-data.js"></script>
<script src="stb-pfad.js"></script>
</body>
</html>
