<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Echo Stammbaum</title>
<meta name="theme-color" content="#F2F3EF">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="tools.css">
<script src="theme.js"></script>
<script src="kurator.js"></script>
<link rel="stylesheet" href="theme.css">
<style>
.trow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tcard{position:relative;flex:0 0 auto;width:158px;min-height:92px;display:grid;gap:2px;align-content:start;text-align:left;padding:12px 12px 10px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;scroll-snap-align:start}
.tcard b{font-size:15px;line-height:1.2;padding-right:20px}
.tcard.m{border-left:3px solid var(--calm)}.tcard.f{border-left:3px solid var(--rec)}.tcard.me{border:1.5px solid var(--gold)}
.tcard.empty{border-style:dashed;background:transparent;color:var(--muted);align-content:center}
.tcard .tn{position:absolute;top:8px;right:10px;font:500 11px var(--f-mono,monospace);color:var(--muted)}
.tcard .ts{position:absolute;bottom:8px;right:10px;font-size:13px}
</style>
</head>
<body>
<main id="app"></main>
<script src="tools-common.js"></script>
<script src="stammbaum.js"></script>
</body>
</html>
