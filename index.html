<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Echo Voice Journal</title>
<meta name="theme-color" content="#F2F3EF">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Echo">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one calm column, record button as the hero, tab bar + mini player docked at the bottom. */
:root {
  --bg: #F2F3EF; --surface: #FFFFFF; --surface-2: #E7EAE4; --ink: #1A1E1C; --muted: #5C6661; --line: #D5DAD3;
  --rec: #D4542A; --rec-soft: rgba(212,84,42,.12);
  --calm: #1B8173; --calm-soft: rgba(27,129,115,.12);
  --gold: #A87D14; --gold-soft: rgba(184,138,30,.16);
  --shadow: 0 1px 2px rgba(20,30,25,.05), 0 10px 28px rgba(20,30,25,.07);
  --f-display: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 18px; --tabh: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1211; --surface: #171B19; --surface-2: #212624; --ink: #E8ECE7; --muted: #95A09A; --line: #2A312E;
  --rec: #FF7647; --rec-soft: rgba(255,118,71,.15); --calm: #3DC2AD; --calm-soft: rgba(61,194,173,.14);
  --gold: #E5B84C; --gold-soft: rgba(229,184,76,.15); --shadow: 0 1px 0 rgba(255,255,255,.03);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F1211; --surface: #171B19; --surface-2: #212624; --ink: #E8ECE7; --muted: #95A09A; --line: #2A312E;
  --rec: #FF7647; --rec-soft: rgba(255,118,71,.15); --calm: #3DC2AD; --calm-soft: rgba(61,194,173,.14);
  --gold: #E5B84C; --gold-soft: rgba(229,184,76,.15); --shadow: 0 1px 0 rgba(255,255,255,.03);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--calm); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

#app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 18px) calc(var(--tabh) + 120px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 14px;
}
h1, h2, h3, h4 { margin: 0; font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.1; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack { display: grid; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.card.flat { box-shadow: none; }

.btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px; font-weight: 500; font-size: 15px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.rec { background: var(--rec); border-color: var(--rec); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 6px 12px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; border: 1px solid transparent; background: transparent; display: inline-grid; place-items: center; color: var(--ink); }
.icon-btn:hover { background: var(--surface-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13.5px; color: var(--muted); }
.input, textarea.input, select.input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
textarea.input { resize: vertical; min-height: 80px; line-height: 1.45; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--calm); border-radius: 99px; transition: width .6s ease; }
.bar.gold > i { background: var(--gold); }

/* Header + stats */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-display); font-size: 22px; line-height: 1.1; display: flex; align-items: center; gap: 6px; }
.stat .small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flame { color: var(--rec); }
.flame.cold { color: var(--muted); }

/* Record hero */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px 16px 22px; display: grid; gap: 16px; justify-items: center; text-align: center; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.hero .chips { justify-self: stretch; }
.hero > :not(canvas) { position: relative; }
.hero canvas { position: absolute; inset: auto 0 0 0; width: 100%; height: 90px; pointer-events: none; opacity: .9; }
.prompt { font-family: var(--f-display); font-size: 21px; line-height: 1.25; max-width: 30ch; font-weight: 500; position: relative; }
.micwrap { position: relative; width: 148px; height: 148px; display: grid; place-items: center; }
.micwrap::before, .micwrap::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--rec-soft); animation: breathe 9s ease-in-out infinite; }
.micwrap::after { inset: -14px; opacity: .55; animation-duration: 13s; animation-delay: -4s; }
@keyframes breathe { 0%,100% { transform: scale(.92); } 50% { transform: scale(1.04); } }
.micbtn { position: relative; z-index: 1; width: 104px; height: 104px; border-radius: 50%; border: 0; background: var(--rec); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 26px rgba(212,84,42,.35); }
.micbtn svg.i { width: 40px; height: 40px; stroke-width: 1.8; }
.micbtn:active { transform: scale(.97); }

/* Quests */
.quest { display: flex; align-items: center; gap: 12px; padding: 8px 4px; border: 0; background: none; text-align: left; width: 100%; border-radius: 12px; }
.quest:hover { background: var(--surface-2); }
.qdot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; color: transparent; }
.quest.done .qdot { background: var(--calm); border-color: var(--calm); color: #fff; }
.quest.done .qlabel { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.qdot svg.i { width: 15px; height: 15px; stroke-width: 3; }
.xp { font-family: var(--f-mono); font-size: 12.5px; color: var(--gold); background: var(--gold-soft); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.ring { --p: 0; width: 44px; height: 44px; border-radius: 50%; background: conic-gradient(var(--calm) calc(var(--p) * 1%), var(--surface-2) 0); display: grid; place-items: center; flex: none; }
.ring span { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font: 600 13px var(--f-mono); }

/* Lists */
.check { display: flex; align-items: flex-start; gap: 10px; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--calm); flex: none; }
.check.done span { color: var(--muted); text-decoration: line-through; }
.goal { display: grid; gap: 6px; }
.gcard { display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; min-width: 0; }
.gcard.mid { border-left: 3px solid var(--calm); }
.gcard.big { border-left: 5px solid var(--calm); padding: 18px; }
.gcard.big .gtitle { font-size: 19px; }
.gcard.complete .gtitle { color: var(--muted); }
.gnum { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--calm-soft); color: var(--calm); display: grid; place-items: center; font: 600 13px var(--f-mono); }
.gcard.complete .gnum { background: var(--calm); color: #fff; }
.gnum svg.i { width: 16px; height: 16px; stroke-width: 3; }
.gtitle { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.gbadge { display: inline-block; font-size: 11.5px; font-weight: 500; background: var(--calm-soft); color: var(--calm); border-radius: 6px; padding: 2px 7px; vertical-align: middle; }
.days { display: flex; gap: 4px; flex-wrap: wrap; }
.day { width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); font-size: 12.5px; color: var(--muted); }
.day.on { background: var(--calm); border-color: var(--calm); color: #fff; font-weight: 700; }
.day.now { outline: 2px solid var(--ink); outline-offset: 1px; }
.dots { display: inline-flex; gap: 3px; flex: none; align-self: center; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-2); }
.dots i.on { background: var(--calm); }
.dots i.now { box-shadow: 0 0 0 1.5px var(--ink); }
.bar.big { height: 10px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; }
.stepper button { width: 34px; height: 30px; border: 0; background: none; display: grid; place-items: center; }
.stepper span { min-width: 44px; text-align: center; font: 500 13.5px var(--f-mono); }

/* History */
.heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); display: block; max-width: 100%; }
i[data-l="1"] { background: color-mix(in srgb, var(--calm) 30%, var(--surface-2)); }
i[data-l="2"] { background: color-mix(in srgb, var(--calm) 55%, var(--surface-2)); }
i[data-l="3"] { background: color-mix(in srgb, var(--calm) 80%, var(--surface-2)); }
i[data-l="4"] { background: var(--calm); }
i[data-l="0"] { background: var(--surface-2); }
.heat i.future { visibility: hidden; }
.heat i.today { outline: 1.5px solid var(--ink); outline-offset: -1.5px; }
.dayhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 6px 2px 0; }
.memo { display: grid; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); min-width: 0; }
.memo.playing { border-color: var(--calm); box-shadow: 0 0 0 3px var(--calm-soft); }
.memo .title { font-weight: 700; }
.memo details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.memo details p { margin-top: 6px; white-space: pre-wrap; font-size: 15px; overflow-wrap: anywhere; }
.playbtn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.playbtn svg.i { width: 18px; height: 18px; fill: currentColor; }
.status { font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.status.err { color: var(--rec); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--calm); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Socratic */
.chat { display: grid; gap: 10px; }
.xwgrid { display: grid; gap: 2px; margin: 0 auto; width: 100%; touch-action: manipulation; }
.xwcell { position: relative; aspect-ratio: 1; }
.xwcell input { position: absolute; inset: 0; width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--ink); text-align: center; text-transform: uppercase; font: 700 clamp(12px, 3.6vw, 19px)/1 var(--f-mono, monospace); padding: 10% 0 0; caret-color: transparent; outline: none; }
.xwcell input.inword { background: var(--calm-soft); }
.xwcell input:focus { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink) inset; }
.xwcell input.wrong { color: #c0392b; background: #fbe3df; }
.xwcell input.rev { color: var(--muted, #888); }
.xwcell input.ok { border-color: var(--calm); }
.xwkb { position: fixed; left: 0; right: 0; bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px)); z-index: 19; background: var(--surface-2); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-left, 0px)) 8px max(6px, env(safe-area-inset-right, 0px)); display: grid; gap: 6px; }
.xwkb .kbr { display: flex; gap: 5px; justify-content: center; max-width: 560px; margin: 0 auto; width: 100%; }
.xwkb button { flex: 1; max-width: 46px; height: 46px; border: 0; border-radius: 8px; background: var(--surface); color: var(--ink); font: 700 17px/1 var(--f-body); box-shadow: 0 1px 0 var(--line); touch-action: manipulation; }
.xwkb button.w { max-width: 64px; flex: 1.5; }
.xwkb button:active { background: var(--calm-soft); }
.xwcell .num { position: absolute; top: 1px; left: 3px; font-size: 8.5px; line-height: 1; color: var(--muted, #888); pointer-events: none; z-index: 1; }
.xwclue { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 8px 0; font-weight: 600; min-height: 2.6em; }
.xwlist { display: grid; gap: 4px; }
.xwlist button { text-align: left; border: 0; background: none; padding: 4px 6px; border-radius: 8px; color: inherit; font: inherit; font-size: 14.5px; cursor: pointer; }
.xwlist button.on { background: var(--calm-soft); }
.xwlist button.solved { color: var(--muted, #888); text-decoration: line-through; text-decoration-color: var(--line); }
.xwcols { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.chars { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.charbtn { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; display: grid; gap: 4px; color: inherit; font: inherit; cursor: pointer; transition: transform .12s; }
.charbtn:hover { transform: translateY(-1px); }
.charbtn[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.charbtn .em { font-size: 30px; line-height: 1.1; }
.charbtn .small { line-height: 1.35; }
.esrow { display: flex; gap: 8px; align-items: flex-start; }
.esrow .av { font-size: 24px; line-height: 1; padding-top: 8px; }
.esrow .bubble { max-width: 100%; }
.saybtn { border: 0; background: none; padding: 2px 4px; font-size: 13px; color: var(--muted, inherit); opacity: .75; cursor: pointer; }
.saybtn:hover { opacity: 1; }
.btn.talk { font-size: 16px; padding: 10px 18px; }
.bubble em { opacity: .7; }
.fix { font-size: 13.5px; opacity: .85; border-left: 3px solid var(--line); padding-left: 8px; }
.bubble { padding: 12px 14px; border-radius: 16px; max-width: 92%; overflow-wrap: anywhere; line-height: 1.5; }
.bubble.a { background: var(--surface); border: 1px solid var(--line); justify-self: start; border-bottom-left-radius: 6px; }
.bubble.u { background: var(--calm-soft); justify-self: end; border-bottom-right-radius: 6px; white-space: pre-wrap; }
.bubble p + p, .md p + p, .md ul, .md h4 { margin-top: 8px; }
.md h4 { font-size: 15px; }
.md ul { padding-left: 20px; margin-bottom: 0; }
.md li + li { margin-top: 3px; }
.composer { position: sticky; bottom: calc(var(--tabh) + 8px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px; display: grid; gap: 8px; box-shadow: var(--shadow); }
.composer textarea { border: 0; background: transparent; min-height: 64px; padding: 4px 6px; outline: none; }

/* Badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.badge { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 4px; background: var(--surface); }
.badge .em { font-size: 26px; line-height: 1; }
.badge.locked .em { filter: grayscale(1); opacity: .45; }
.badge.locked b { color: var(--muted); }
.badge.secret { border-style: dashed; }
.badge.secret:not(.locked) { border: 1px solid var(--gold); background: var(--gold-soft); }

/* Tabs + player */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#tabs .in { max-width: 560px; margin: 0 auto; height: var(--tabh); display: grid; grid-template-columns: repeat(6, 1fr); }
#tabs button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 12px; color: var(--muted); }
#tabs button[aria-current="page"] { color: var(--ink); font-weight: 700; }
#tabs button[aria-current="page"] svg.i { stroke: var(--rec); }
#player { position: fixed; left: 0; right: 0; z-index: 19; bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px));
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); padding-bottom: 8px; }
#player .in { max-width: 560px; margin: 0 auto; grid-template-columns: minmax(0, 1fr); background: var(--ink); color: var(--bg); border-radius: 18px; padding: 10px 12px; display: grid; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
#player .in > * { min-width: 0; }
#player .row { gap: 4px; }
#player .icon-btn { color: var(--bg); width: 36px; height: 36px; flex: none; }
@media (max-width: 480px) { .speedhint { display: none; } }
#player .icon-btn:hover { background: rgba(127,127,127,.2); }
#player .icon-btn.big svg.i { fill: currentColor; }
#player .meta { font-size: 13px; opacity: .75; }
#player .ttl { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#player input[type=range] { width: 100%; accent-color: var(--rec); margin: 0; }
.speedbtn { flex: none; border: 1px solid rgba(127,127,127,.45); background: none; color: inherit; border-radius: 99px; padding: 5px 10px; font: 600 13px var(--f-mono); min-width: 62px; }
.speeds { display: flex; gap: 6px; flex-wrap: wrap; }
.speeds button { border: 1px solid rgba(127,127,127,.45); background: none; color: inherit; border-radius: 99px; padding: 4px 10px; font: 500 13px var(--f-mono); }
.speeds button[aria-pressed="true"] { background: var(--rec); border-color: var(--rec); color: #fff; }

/* Recorder overlay */
#recorder { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); }
#recorder .mid { display: grid; align-content: center; justify-items: center; gap: 22px; text-align: center; max-width: 560px; margin: 0 auto; width: 100%; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--rec); animation: pulse 1.6s ease-in-out infinite; }
.paused .dot { animation: none; background: var(--muted); }
@keyframes pulse { 50% { opacity: .25; } }
.rectime { font: 600 54px/1 var(--f-mono); letter-spacing: -.02em; }
#recWave { width: 100%; height: 110px; }
.live { min-height: 3em; color: var(--muted); font-size: 15px; max-width: 46ch; }

const STORES = { memos: 'id', dialogs: 'id', recaps: 'day', goals: 'week', commitments: 'id', xw: 'id' };
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('echo-journal', 2);
      r.onupgradeneeded = () => { for (const [s, key] of Object.entries(STORES)) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: key }); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => { const q = fn(this.db.transaction(store, mode).objectStore(store)); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  },
  all(s) { return this.req(s, 'readonly', o => o.getAll()); },
  put(s, v) { abSchedule(); return this.req(s, 'readwrite', o => o.put(v)).catch(e => { toast(String(e && e.message || e), 'err'); }); },
  del(s, k) { abSchedule(); return this.req(s, 'readwrite', o => o.delete(k)); },
  clear(s) { abSchedule(); return this.req(s, 'readwrite', o => o.clear()); },
};

// Journal XP is weighted ×4 since game XP counts towards the Echo level too (Oct 2026).
const JX = 4;
const memoXP = m => JX * (10 + 2 * Math.min(10, Math.floor((m.dur || 0) / 60)));
const isRecapDone = r => !!r && (!!r.text || Object.values(r.reflection || {}).some(v => (v || '').trim().length >= 3));
const levelFrom = xp => Math.floor((1 + Math.sqrt(1 + 4 * xp / 100)) / 2);
const levelBase = n => 100 * n * (n - 1);
const levelName = n => { const L = t('levels'); return L[Math.min(n, L.length) - 1] + (n > L.length ? ' ' + (n - L.length + 1) : ''); };

function streakInfo(daySet) {
  // Walk back from today. One missed day per 7 days is forgiven, two in a row ends the streak.
  let d = new Date(), count = 0, i = 0, lastFreeze = -100, freezeUsed = false;
  const doneToday = daySet.has(dayKey(d));
  if (!doneToday) d = addDays(d, -1);
  while (i < 5000) {
    const k = dayKey(d);
    if (daySet.has(k)) count++;
    else if (i - lastFreeze >= 7 && daySet.has(dayKey(addDays(d, -1)))) { lastFreeze = i; if (i < 7) freezeUsed = true; }
    else break;
    d = addDays(d, -1); i++;
  }
  return { count, doneToday, freezeUsed };
}

function computeStats() {
  const td = today(), ws = weekStart();
  const dayMin = new Map(); let seconds = 0, weekSec = 0; let xp = 0;
  for (const m of S.memos) {
    dayMin.set(m.day, (dayMin.get(m.day) || 0) + (m.dur || 0) / 60);
    seconds += m.dur || 0; xp += memoXP(m);
    if (m.day >= ws) weekSec += m.dur || 0;
  }
  // Spanish rounds are an optional bonus task of their own, not the daily Socratic round.
  const socDone = S.dialogs.filter(d => d.completed && d.mode !== 'es');
  xp += socDone.length * 20 * JX;
  const esDone = S.dialogs.filter(d => d.completed && d.mode === 'es');
  xp += esDone.length * 15 * JX;
  // Crosswords: first completion +15 (+5 with solution), each repeat solved on your own +5.
  const xwDoneDays = new Set();
  for (const x of Object.values(S.xw)) xwCompletions(x).forEach((c, i) => { xp += i === 0 ? (c.rev ? 5 : (c.xp ?? 15)) : (c.rev ? 0 : 5); xwDoneDays.add(dayKey(new Date(c.at))); });
  const recapDays = Object.values(S.recaps).filter(r => !r.day.includes(':') && isRecapDone(r)).map(r => r.day);
  xp += recapDays.length * 10 * JX;
  const commitDone = S.commitments.filter(c => c.done).length;
  xp += commitDone * 5 * JX;
  let goalWeeks = 0;
  for (const g of Object.values(S.goals)) {
    const wp = weekProgress(g);
    xp += 3 * JX * wp.done;
    if (wp.items.length && wp.items.every(goalDone)) goalWeeks++;
  }
  // Games count in full: Atlas (laender.html) and the other games (spiele.html).
  const geo = LS.get('echo-geo', null) || {}, games = LS.get('echo-games', null) || {};
  const geoDays = Object.entries(geo.days || {}).filter(([, v]) => v && v.r > 0).map(([k]) => k);
  const gameXP = Math.max(0, geo.xp || 0) + Math.max(0, games.xp || 0);
  xp += gameXP;
  const gDays = games.days || {}, gToday = gDays[td] || {};
  const nr = notesRead(); xp += Object.keys(nr).length * NOTE_XP;
  const pls = plans(); xp += Object.keys(pls).length * PLAN_XP;
  for (const f of fails()) xp += FAIL_XP * (1 + (f.reviews || []).length);
  const pl = played(); let echoCount = 0;
  for (const ids of Object.values(pl)) { echoCount += ids.length; xp += 2 * JX * Math.min(5, ids.length); }
  const socDays = new Set(socDone.map(d => d.day)), recapSet = new Set(recapDays);
  const fullDays = [...dayMin.keys()].filter(k => socDays.has(k) && recapSet.has(k));
  xp += fullDays.length * 15 * JX;
  const st = streakInfo(new Set(dayMin.keys()));
  const best = Math.max(st.count, LS.get('echo-best', 0));
  if (best > LS.get('echo-best', 0)) LS.set('echo-best', best);
  xp = Math.max(0, xp); // revealed crossword words can subtract, never below zero overall
  const level = levelFrom(xp);
  const quests = { memo: dayMin.has(td), socratic: socDays.has(td), recap: recapSet.has(td), echo: (pl[td] || []).length > 0,
    es: esDone.some(d => d.day === td), xw: xwDoneDays.has(td), geo: geoDays.includes(td), note: !!nr[td], plan: !!pls[td], wordle: !!gToday.wordle, rechnen: !!gToday.rechnen, quiz_ernmed: !!gToday.quiz_ernmed, quiz_steuer: !!gToday.quiz_steuer };
  // Extra counters for badges.
  const perDay = new Map(), imps = new Set(); let longest = 0, night = 0, early = 0, pi = 0, mirror = 0, holiday = 0;
  for (const m of S.memos) {
    perDay.set(m.day, (perDay.get(m.day) || 0) + 1);
    if (m.impulse) imps.add(m.impulse);
    longest = Math.max(longest, m.dur || 0);
    const dt = new Date(m.createdAt), h = dt.getHours(), hm = pad(h) + pad(dt.getMinutes());
    if (h < 4) night++; else if (h < 6) early++;
    if (m.blob && Math.floor(m.dur || 0) === 194) pi++;
    if (hm === hm.split('').reverse().join('')) mirror++;
    if (['10-31', '12-24', '12-31', '01-01'].includes(m.day.slice(5))) holiday++;
  }
  const active = [...dayMin.keys()].sort();
  let comeback = 0; for (let i = 1; i < active.length; i++) if ((parseDay(active[i]) - parseDay(active[i - 1])) / 864e5 >= 8) comeback++;
  const hintTexts = [I18N.de.hintMsg, I18N.en.hintMsg];
  const maxHints = Math.max(0, ...S.dialogs.map(d => d.messages.filter(m => m.role === 'user' && hintTexts.includes(m.content)).length));
  const mainGoal = Object.values(S.goals).some(g => weekProgress(g).items.some(it => it.tier === 'big' && goalDone(it)));
  const extra = {
    activeDays: dayMin.size, maxDayMemos: Math.max(0, ...perDay.values()), longest, night, early, pi, mirror, holiday, comeback, maxHints, mainGoal: mainGoal ? 1 : 0,
    talk: socDone.filter(d => d.mode === 'talk').length, recaps: recapDays.length, impulses: imps.size,
    maxSpeed: LS.get('echo-maxspeed', 1), tabs: LS.get('echo-tabs', []).length, dayOne: active.length && fullDays.includes(active[0]) ? 1 : 0,
  };
  return { ...extra,
    xp, level, levelBase: levelBase(level), levelNext: levelBase(level + 1), streak: st, bestStreak: best,
    minutes: seconds / 60, weekMin: Math.round(weekSec / 60), memoCount: S.memos.length,
    soc: socDone.length, fullDays: fullDays.length, echoCount, commitDone, goalWeeks, dayMin, quests,
  };
}

function recapMaterial(day) {
  const memos = S.memos.filter(m => m.day === day).sort((a, b) => a.createdAt - b.createdAt);
  const out = [`Date: ${fmtDate(day)}`, '', 'VOICE MEMOS:'];
  for (const m of memos) out.push(`[${fmtTime(m.createdAt)} | ${fmtDur(m.dur)}] ${(m.transcript || m.summary || '(audio only, no text)').slice(0, 3500)}`);
  const ds = S.dialogs.filter(d => d.day === day && d.completed);
  if (ds.length) { out.push('', 'SOCRATIC STUDY ROUNDS (nutritional medicine):'); for (const d of ds) out.push(`- ${d.topic}: ${(d.summary && d.summary.keyPoints || []).join('; ')}`); }
  const cDone = S.commitments.filter(c => c.done && c.doneAt && dayKey(new Date(c.doneAt)) === day);
  const cOpen = S.commitments.filter(c => !c.done && c.day <= day);
  if (cDone.length) out.push('', 'COMMITMENTS COMPLETED TODAY:', ...cDone.map(c => '- ' + c.text));
  if (cOpen.length) out.push('', 'OPEN COMMITMENTS:', ...cOpen.map(c => '- ' + c.text));
  const g = S.goals[weekStart(parseDay(day))];
  if (g && g.items.length) out.push('', 'WEEKLY GOALS (progress so far, ordered from biggest to smallest):', ...g.items.map(goalLine));
  const ref = (S.recaps[day] || {}).reflection || {};
  if (Object.values(ref).some(v => v && v.trim())) out.push('', 'OWN NOTES:', `did: ${ref.did || ''}`, `went well: ${ref.good || ''}`, `next: ${ref.next || ''}`);
  return out.join('\n');
}
async function makeRecap(day) {

const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function buildBackup() {
  const memos = [];
  for (const m of S.memos) memos.push(Object.assign({}, m, { blob: m.blob ? await blobToDataURL(m.blob) : null, status: '' }));
  const settings = Object.assign({}, S.set); delete settings.anthropicKey; delete settings.openaiKey; // keys never leave the browser
  const data = { app: 'echo-journal', version: 1, exportedAt: new Date().toISOString(), memos, dialogs: S.dialogs, recaps: Object.values(S.recaps), goals: Object.values(S.goals), commitments: S.commitments, xw: Object.values(S.xw), played: played(), geo: LS.get('echo-geo', null), games: LS.get('echo-games', null), notes: notesRead(), noteAns: noteAnswers(), fails: fails(), plans: plans(), settings };
  return new Blob([JSON.stringify(data)], { type: 'application/json' });
}
async function exportBackup() {
  const out = await buildBackup(), name = 'echo-backup-' + today() + '.json';
  AB.last = Date.now(); LS.set('echo-backup-last', AB.last);
  if (IS_ARTIFACT) {
    try { const dl = await window.claude.use('downloads'); if (!dl) throw new Error('unavailable'); await dl.save({ filename: name, data: out }); toast(t('exported'), 'ok'); }
    catch (e) { if (!(e && /cancel|declin/.test(String(e.code || '')))) toast(t('exportFail'), 'err'); }
    return;
  }
  const url = URL.createObjectURL(out);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); toast(t('exported'), 'ok');
}
async function importBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'echo-journal') throw new Error('format');
    let n = 0;
    for (const m of data.memos || []) { if (m.blob) m.blob = await (await fetch(m.blob)).blob(); await DB.put('memos', m); n++; }
    for (const [store, list] of [['dialogs', data.dialogs], ['recaps', data.recaps], ['goals', data.goals], ['commitments', data.commitments], ['xw', data.xw]]) for (const x of list || []) { await DB.put(store, x); n++; }
    if (data.geo && (data.geo.xp || 0) > ((LS.get('echo-geo', null) || {}).xp || 0)) LS.set('echo-geo', data.geo);
    if (data.notes) LS.set('echo-notes', Object.assign({}, notesRead(), data.notes));
    if (data.plans) LS.set('echo-plans', Object.assign({}, data.plans, plans()));
    if (data.fails) { const have = new Set(fails().map(f => f.id)); saveFails(fails().concat(data.fails.filter(f => !have.has(f.id)))); }
    if (data.noteAns) LS.set('echo-note-ans', Object.assign({}, data.noteAns, noteAnswers()));
    if (data.games && (data.games.xp || 0) > ((LS.get('echo-games', null) || {}).xp || 0)) LS.set('echo-games', data.games);
    if (data.played) { const pl = played(); for (const [d, ids] of Object.entries(data.played)) pl[d] = [...new Set([...(pl[d] || []), ...ids])]; LS.set('echo-played', pl); }
    if (data.settings) { const keep = { anthropicKey: S.set.anthropicKey, openaiKey: S.set.openaiKey }; S.set = Object.assign({}, S.set, data.settings, keep); saveSettings(); applyTheme(); }
    await loadAll(); toast(t('imported', n), 'ok'); closeSheet(); afterChange();
    return n;
  } catch { toast(t('importFail'), 'err'); return -1; }
}

/* ---------- automatic backup ----------
   The browser may wipe IndexedDB (clear-on-exit, cleanup tools, profile switch). Echo therefore mirrors everything
   into one JSON file the user picks once (File System Access API, Edge/Chrome desktop). The file handle itself lives
   in a separate database; after a restart the browser may ask once to allow writing again ("paused"). */
const KV = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => { const r = indexedDB.open('echo-meta', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    return this.db;
  },
  async op(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const q = fn(db.transaction('kv', mode).objectStore('kv')); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  get(k) { return this.op('readonly', o => o.get(k)); },
  set(k, v) { return this.op('readwrite', o => o.put(v, k)); },
  del(k) { return this.op('readwrite', o => o.delete(k)); },
};
const FS_OK = !IS_ARTIFACT && typeof window.showSaveFilePicker === 'function';
const AB = { handle: null, state: 'off', timer: 0, busy: false, dirty: false, last: LS.get('echo-backup-last', 0) };
const BACKUP_TYPES = [{ description: 'Echo-Backup', accept: { 'application/json': ['.json'] } }];
const entryCount = () => S.memos.length + S.dialogs.length + S.commitments.length + Object.keys(S.recaps).length + Object.keys(S.goals).length + Object.keys(S.xw).length;
const journalEmpty = () => !entryCount();
async function abInit() {
  if (!FS_OK) { AB.state = 'unsupported'; return; }
  try { AB.handle = (await KV.get('backupHandle')) || null; } catch { AB.handle = null; }
  if (!AB.handle) { AB.state = 'off'; return; }
  let p = 'prompt'; try { p = await AB.handle.queryPermission({ mode: 'readwrite' }); } catch { /* handle no longer valid */ }
  AB.state = p === 'granted' ? 'on' : 'paused';
}
function abSchedule() {
  if (AB.state !== 'on') return;
  clearTimeout(AB.timer); AB.timer = setTimeout(abWrite, 4000);
}
async function abWrite() {
  clearTimeout(AB.timer); AB.timer = 0;
  if (AB.state !== 'on' || !AB.handle) return;
  if (AB.busy) { AB.dirty = true; return; }
  if (!entryCount()) return; // never overwrite a good backup with an empty journal
  AB.busy = true;
  try {
    const blob = await buildBackup(), w = await AB.handle.createWritable();
    await w.write(blob); await w.close();
    AB.last = Date.now(); LS.set('echo-backup-last', AB.last);
  } catch (e) {
    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) { AB.state = 'paused'; abRefresh(); }
    else toast(t('autoFail') + ': ' + String(e && e.message || e), 'err');
  } finally {
    AB.busy = false;
    if (AB.dirty) { AB.dirty = false; abSchedule(); }
  }
}
async function abAdopt(handle) {
  // Merge what is already in the chosen file before writing to it, so picking an old backup never erases it.
  let n = 0;
  try { const f = await handle.getFile(); if (f.size) { const txt = await f.text(); if (txt.includes('"echo-journal"')) n = await importBackup(new File([txt], f.name)); } } catch { /* new or unreadable file */ }
  AB.handle = handle; AB.state = 'on';
  try { await KV.set('backupHandle', handle); } catch { /* handle not storable: works until reload */ }
  await abWrite(); if (n <= 0) toast(t('autoDone'), 'ok'); abRefresh();
}
async function abPick() {
  let h;
  try { h = await window.showSaveFilePicker({ suggestedName: 'echo-backup.json', types: BACKUP_TYPES }); }
  catch (e) { if (!(e && e.name === 'AbortError')) toast(t('autoFail'), 'err'); return; }
  await abAdopt(h);
}
async function abRestore() {
  let h;
  try { [h] = await window.showOpenFilePicker({ types: BACKUP_TYPES }); }
  catch (e) { if (!(e && e.name === 'AbortError')) toast(t('importFail'), 'err'); return; }
  let p = 'denied'; try { p = await h.requestPermission({ mode: 'readwrite' }); } catch { /* read-only is fine for the restore itself */ }
  if (p === 'granted') await abAdopt(h);
  else { await importBackup(await h.getFile()); }
}
async function abResume() {
  if (!AB.handle) return;
  let p = 'denied'; try { p = await AB.handle.requestPermission({ mode: 'readwrite' }); } catch { /* dismissed */ }
  if (p === 'granted') { AB.state = 'on'; await abWrite(); }
  abRefresh();
}
async function abOff() {
  AB.handle = null; AB.state = 'off'; clearTimeout(AB.timer);
  try { await KV.del('backupHandle'); } catch { /* nothing stored */ }
  abRefresh();
}

    return card(t('restoreTitle'), t('restoreText'), btn + `<button class="btn ghost sm" data-act="ab-hide">${esc(t('restoreHide'))}</button>`);

  if (AB.state === 'paused') return card(t('autoPaused'), t('autoPausedHint'), `<button class="btn primary sm" data-act="ab-resume">${esc(t('autoResume'))}</button>`);
  if (journalEmpty() || Date.now() < LS.get('echo-ab-snooze', 0)) return '';
  if (AB.state === 'off') return card(t('autoSetupTitle'), t('autoSetupText'), `<button class="btn primary sm" data-act="ab-pick">${icon('download')} ${esc(t('autoPick'))}</button><button class="btn ghost sm" data-act="ab-snooze">${esc(t('later'))}</button>`);
  const days = AB.last ? Math.floor((Date.now() - AB.last) / 864e5) : 99;
  if (AB.state === 'unsupported' && days >= 7) return card(AB.last ? t('autoNag', days) : t('autoSetupTitle'), t('autoNagText'), `<button class="btn primary sm" data-act="export">${icon('download')} ${esc(t('exportBtn'))}</button><button class="btn ghost sm" data-act="ab-snooze">${esc(t('later'))}</button>`);
  return '';
}

let heroRaf = 0;
function heroWave() {
  // Slow drifting waveform at the foot of the record card: the "voice" breathing while idle.
  cancelAnimationFrame(heroRaf);
  const c = $('#heroWave'); if (!c) return;
  const g = c.getContext('2d'), dpr = devicePixelRatio || 1;
  const cols = ['--rec', '--calm'].map(v => getComputedStyle(document.documentElement).getPropertyValue(v).trim());
  let last = 0;
  const step = ts => {
    if (!c.isConnected) return;
    heroRaf = requestAnimationFrame(step);
    if (ts - last < 33) return; last = ts;
    const w = c.clientWidth, h = c.clientHeight;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    const s = ts / 1000;
    [[0.16, 22, 0.011, 11, cols[0]], [0.10, 30, 0.007, 17, cols[1]]].forEach(([alpha, amp, k, period, col], j) => {
      g.beginPath(); g.moveTo(0, h);
      for (let x = 0; x <= w; x += 6) {
        const y = h * 0.62 + Math.sin(x * k + s * (2 * Math.PI / period) + j * 2) * amp * (0.6 + 0.4 * Math.sin(s * 2 * Math.PI / 21 + x * 0.003));
        g.lineTo(x, y);
      }
      g.lineTo(w, h); g.closePath(); g.globalAlpha = alpha; g.fillStyle = col; g.fill();
    });
    g.globalAlpha = 1;
  };
  heroRaf = requestAnimationFrame(step);
}

    c.done = el.checked; c.doneAt = el.checked ? Date.now() : null; await DB.put('commitments', c);

    const day = S.recapDay || today(); const r = S.recaps[day] || { day };
    r.reflection = Object.assign({}, r.reflection, { [el.dataset.ref]: el.value }); S.recaps[day] = r;
    await DB.put('recaps', r); toast(t('reflectSaved')); celebrate();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'histSearch') { S.histQuery = el.value; render(); }
  else if (el.id === 'socInput') S.draft = el.value;
  else if (el.id === 'socTopic') LS.set('echo-soc-topic', el.value);
  else if (el.id === 'socMaterial') LS.set('echo-soc-material', el.value);
  else if (el.id === 'plRate') setSpeedLive(+el.value);
  else if (el.id === 'plSeek') {
    const m = currentMemo(); if (!m) return; P.seeking = true;
    const d = isFinite(P.audio.duration) && P.audio.duration > 0 ? P.audio.duration : m.dur;
    P.audio.currentTime = d * el.value / 1000; setTimeout(() => { P.seeking = false; }, 200);
  }
});
function setSpeedLive(v) {
  // Slider drag: apply immediately without rebuilding the player (keeps the thumb under the finger).
  S.set.speed = v; saveSettings(); trackSpeed(v); P.audio.defaultPlaybackRate = v; P.audio.playbackRate = v;
  const btn = $('#player .speedbtn'); if (btn) btn.textContent = v.toFixed(2).replace(/0$/, '').replace(/\.0$/, '') + '×';
  $$('#player .speeds button').forEach(x => x.setAttribute('aria-pressed', String(Math.abs(+x.dataset.v - v) < 0.001)));
  const lab = $('#player .row.spread .mono'); if (lab) lab.textContent = v.toFixed(2) + '×';
}
document.addEventListener('keydown', e => {
  if (e.target.id === 'socInput' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); socSend(e.target.value); }
  if (e.target.id === 'commitText' && e.key === 'Enter') { e.preventDefault(); $('[data-act="commit-save"]').click(); }
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
});
addEventListener('beforeunload', e => { if (R.rec) { e.preventDefault(); e.returnValue = ''; } });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); render(); });

(async function boot() {
  applyTheme();
  try { await DB.open(); await loadAll(); }
  catch (e) { $('#app').innerHTML = `<div class="card"><h2>IndexedDB</h2><p>${esc(String(e && e.message || e))}</p></div>`; return; }
  // Free browser speech recognition fills in the transcript while recording. Turned on once by default on desktop;
  // on phones it can fight the recorder for the microphone, so it stays opt-in there.
  // Oct 2026: Haiku for everything (cost). Older installs saved Sonnet into their settings; switch them once.
  if (!LS.get('echo-mig-haiku', false)) { if (/sonnet/i.test(S.set.model || '')) { S.set.model = 'claude-haiku-5-5'; saveSettings(); } LS.set('echo-mig-haiku', true); }
  if (!LS.get('echo-mig-livestt', false)) {
    if (!IS_ARTIFACT && (window.SpeechRecognition || window.webkitSpeechRecognition) && !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) { S.set.liveStt = true; saveSettings(); }
    LS.set('echo-mig-livestt', true);
  }
  const seed = window.ECHO_SEED;
  for (const sg of (seed && seed.goals) || []) {
    const flag = 'echo-seed-' + sg.week;
    if (!S.goals[sg.week] && !LS.get(flag, false)) { S.goals[sg.week] = { week: sg.week, items: parseGoalsText(sg.text) }; await DB.put('goals', S.goals[sg.week]); }
    LS.set(flag, true);
  }
  // Reopen today's unfinished round after a reload instead of losing it.
  const open = S.dialogs.filter(d => !d.completed && d.day === today() && d.messages.some(m => m.role === 'assistant')).sort((a, b) => b.createdAt - a.createdAt)[0];
  if (open) S.activeDialog = open.id;
  { const tv = LS.get('echo-tabs', []); if (!tv.includes('today')) LS.set('echo-tabs', [...tv, 'today']); }
  if (location.hash === '#games') { S.tab = 'games'; try { history.replaceState(null, '', location.pathname); } catch { /* ignore */ } }
  await abInit();
  { const g = LS.get('echo-geo', null), gm = LS.get('echo-games', null); if ((g && g.updated > (AB.last || 0)) || (gm && gm.updated > (AB.last || 0))) abSchedule(); }
  if (!journalEmpty()) LS.set('echo-restore-hide', false);
  render(); celebrate();
  if (!notesRead()[today()] && LS.get('echo-note-later', '') !== today() && !journalEmpty()) setTimeout(openNote, 600);
  if (IS_ARTIFACT) window.claude.use('sample').then(fn => { SAMPLE = fn; render(); }).catch(() => {});
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch { /* optional */ }
  if (LS.get('echo-just-updated', false)) { LS.set('echo-just-updated', false); toast(t('updated'), 'ok'); }
  if (!IS_ARTIFACT && 'serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
    // Updates install themselves: check on start and whenever Echo comes back to the foreground; when a new version
    // takes over, reload at the next quiet moment (never mid-recording or while Claude is answering).
    const hadController = !!navigator.serviceWorker.controller;
    let pending = false;
    const quiet = () => !R.rec && !S.socBusy && !esSR && !dictSR && $('#sheet').hidden && !(document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName) && document.activeElement.value);
    const tryReload = () => { if (pending && quiet()) { pending = false; LS.set('echo-just-updated', true); location.reload(); } };
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController) return; pending = true; tryReload(); });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { reg.update().catch(() => {}); tryReload(); } });
      setInterval(() => { reg.update().catch(() => {}); tryReload(); }, 30 * 60 * 1000);
    }).catch(() => {});
    setInterval(tryReload, 20000);
  }
})();
</script>
