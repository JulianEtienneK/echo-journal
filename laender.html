<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Echo Atlas</title>
<meta name="theme-color" content="#F2F3EF">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column like Echo. Home = stats + start; round = map/flag stage on top, answers below; collection = prestige world map + grid. */
:root {
  --bg: #F2F3EF; --surface: #FFFFFF; --surface-2: #E7EAE4; --ink: #1A1E1C; --muted: #5C6661; --line: #D5DAD3;
  --calm: #1B8173; --calm-soft: rgba(27,129,115,.12); --rec: #D4542A; --rec-soft: rgba(212,84,42,.12);
  --gold: #A87D14; --gold-soft: rgba(184,138,30,.16);
  --ocean: #DCE6E8; --land: #C9CFC6; --land-line: #F7F8F5; --hl: #D4542A; --target: #1B8173;
  --shadow: 0 1px 2px rgba(20,30,25,.05), 0 10px 28px rgba(20,30,25,.07);
  --f-display: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 18px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1211; --surface: #171B19; --surface-2: #212624; --ink: #E8ECE7; --muted: #95A09A; --line: #2A312E;
  --calm: #3DC2AD; --calm-soft: rgba(61,194,173,.14); --rec: #FF7647; --rec-soft: rgba(255,118,71,.15);
  --gold: #E5B84C; --gold-soft: rgba(229,184,76,.15);
  --ocean: #142024; --land: #34403B; --land-line: #171B19; --hl: #FF7647; --target: #3DC2AD;
  --shadow: 0 1px 0 rgba(255,255,255,.03); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F1211; --surface: #171B19; --surface-2: #212624; --ink: #E8ECE7; --muted: #95A09A; --line: #2A312E;
  --calm: #3DC2AD; --calm-soft: rgba(61,194,173,.14); --rec: #FF7647; --rec-soft: rgba(255,118,71,.15);
  --gold: #E5B84C; --gold-soft: rgba(229,184,76,.15);
  --ocean: #142024; --land: #34403B; --land-line: #171B19; --hl: #FF7647; --target: #3DC2AD;
  --shadow: 0 1px 0 rgba(255,255,255,.03); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--calm); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
#app {
  max-width: 600px; margin: 0 auto; display: grid; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 40px);
}
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
h2 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 17px; font-weight: 700; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.btn { border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 700; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--calm); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0F1211; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0F1211; } }
.btn.big { padding: 17px 20px; font-size: 18px; width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.link { background: none; border: 0; padding: 6px 0; color: var(--muted); font-weight: 500; white-space: nowrap; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--calm); border-radius: 99px; transition: width .4s ease; }
.bar.gold i { background: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 12px; display: grid; gap: 2px; }
.stat b { font-family: var(--f-display); font-size: 22px; }
.lvl { display: flex; align-items: center; gap: 14px; }
.lvlbadge { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 22px; background: var(--calm-soft); color: var(--calm); flex: none; }

/* stage */
.stage { position: relative; background: var(--ocean); border-radius: var(--r); overflow: hidden; aspect-ratio: 3 / 2; max-width: 100%; }
.stage svg { width: 100%; height: 100%; display: block; }
.stage .sphere { fill: var(--ocean); }
.stage .grat { fill: none; stroke: var(--ink); stroke-opacity: .06; stroke-width: .6; }
.stage .land { fill: var(--land); stroke: var(--land-line); stroke-width: .5; }
.stage.clickable .land { cursor: pointer; }
.stage.clickable .land:hover { fill: var(--gold); fill-opacity: .55; }
.stage .land.target { fill: var(--target); }
.stage .land.wrong { fill: var(--hl); }
.stage .cap { fill: var(--ink); fill-opacity: .55; stroke: var(--surface); stroke-width: .8; pointer-events: none; }
.stage .cap.tcap { fill: #fff; fill-opacity: 1; stroke: var(--ink); stroke-width: 1.2; }
.stage .ring { fill: none; stroke: var(--target); stroke-width: 2.5; }
.stage .ring.wrong { stroke: var(--hl); }
.stage .ring.pulse { animation: pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { stroke-opacity: .35; } }
.flagbig { display: grid; place-items: center; background: var(--surface-2); border-radius: var(--r); padding: 22px; }
.flagbig img { width: min(320px, 80%); aspect-ratio: 4 / 3; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.18); object-fit: cover; }
.q { font-family: var(--f-display); font-size: 22px; font-weight: 700; text-wrap: balance; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 13px 12px; font-weight: 700; text-align: left; display: flex; gap: 10px; align-items: center; min-width: 0; }
.opt .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); flex: none; }
.opt:hover:not(:disabled) { border-color: var(--calm); }
.opt.ok { border-color: var(--calm); background: var(--calm-soft); }
.opt.bad { border-color: var(--rec); background: var(--rec-soft); }
.opt:disabled { cursor: default; }
.opt.flag { padding: 8px; justify-content: center; }
.opt.flag img { width: 100%; aspect-ratio: 4 / 3; border-radius: 6px; object-fit: cover; }
.progress { display: flex; gap: 4px; }
.progress i { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); }
.progress i.ok { background: var(--calm); }
.progress i.bad { background: var(--rec); }
.progress i.cur { background: var(--gold); }
.fb { border-radius: var(--r); padding: 14px 16px; display: flex; gap: 14px; align-items: center; }
.fb.ok { background: var(--calm-soft); }
.fb.bad { background: var(--rec-soft); }
.fb img { width: 72px; aspect-ratio: 4 / 3; border-radius: 5px; object-fit: cover; flex: none; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.xp { font-family: var(--f-mono); font-size: 13px; color: var(--gold); font-weight: 500; white-space: nowrap; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.tag.challenge { background: var(--gold-soft); color: var(--gold); }
.tag.new { background: var(--calm-soft); color: var(--calm); }
.combo { font-family: var(--f-mono); font-size: 13px; color: var(--rec); }

/* prestige */
.pdot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cell { border: 0; background: var(--surface); border-radius: 12px; padding: 8px; display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 8px; align-items: center; text-align: left; box-shadow: var(--shadow); position: relative; }
.cell img { width: 44px; aspect-ratio: 4 / 3; border-radius: 4px; object-fit: cover; }
.cell.unseen img { filter: grayscale(1); opacity: .35; }
.cell .nm { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .cnt { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.cell .stripe { position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 20; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; animation: pop .25s ease; }
@keyframes pop { from { transform: translate(-50%, 10px); opacity: 0; } }
.big-num { font-family: var(--f-display); font-size: 44px; font-weight: 700; line-height: 1; }
.intro-name { font-family: var(--f-display); font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
.ac { position: relative; display: grid; gap: 8px; }
.ac input { width: 100%; font: 700 18px/1.3 var(--f-body); padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.ac input:focus { outline: none; border-color: var(--calm); }
.aclist { display: grid; gap: 4px; max-height: 264px; overflow-y: auto; }
.aclist button { border: 0; background: var(--surface); border-radius: 10px; padding: 10px 12px; text-align: left; font-weight: 500; display: flex; justify-content: space-between; gap: 10px; }
.aclist button.on, .aclist button:hover { background: var(--calm-soft); }
.aclist button small { color: var(--muted); font-weight: 400; }
.aclist mark { background: none; color: var(--calm); font-weight: 700; }
.hint { font-size: 13px; color: var(--muted); }
.fact { background: var(--gold-soft); border-radius: 14px; padding: 12px 14px; font-size: 15px; display: flex; gap: 10px; }
.fact b { color: var(--gold); flex: none; }
.skills { display: inline-flex; gap: 4px; }
.skills i { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.skills i.on { background: var(--calm); box-shadow: none; }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (max-width: 420px) { .opts { grid-template-columns: 1fr; } .opts.flags { grid-template-columns: repeat(2, minmax(0,1fr)); } .stats { grid-template-columns: repeat(3, minmax(0,1fr)); } .stat b { font-size: 19px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"><p class="loading">Atlas lädt …</p></div>
<script src="geo/d3.min.js"></script>
<script src="geo/topojson-client.min.js"></script>
<script src="geo/data.js"></script>
<script src="geo/flags.js"></script>
<script src="geo/facts.js"></script>
<script src="geo/capfacts.js"></script>
<script src="geo/caps.js"></script>
<script>
'use strict';
/* ---------- storage (same origin as Echo: key echo-geo is part of Echo's backup) ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* blocked */ } },
};
const KEY = 'echo-geo';
let ST = LS.get(KEY, null) || { v: 2, xp: 0, cs: {}, days: {}, best: {}, badges: {}, sound: true, updated: 0 };
// v1 → v2: one Leitner box per country becomes three skills (flag, map, capital).
if (ST.v !== 2) {
  for (const st of Object.values(ST.cs || {})) st.sk = st.sk || { flag: { b: st.box || 0, d: st.due || 0 }, map: { b: st.box || 0, d: st.due || 0 }, cap: { b: 0, d: 0 } };
  ST.v = 2; ST.best = typeof ST.best === 'object' && ST.best ? ST.best : {}; ST.badges = ST.badges || {}; if (ST.sound == null) ST.sound = true;
}
ST.hist = ST.hist || [];
const save = () => { ST.updated = Date.now(); LS.set(KEY, ST); };
(() => { const s = LS.get('echo-settings', {}); if (s.theme && s.theme !== 'system') document.documentElement.dataset.theme = s.theme; })();

/* ---------- data ---------- */
const COUNTRIES = GEO.countries.map(c => Object.assign({}, c, { n: (window.NAME_FIX || {})[c.c] || c.n, k: ((window.FACTS || {})[c.c] || [c.cap])[0] || c.cap, fact: ((window.FACTS || {})[c.c] || [])[1] || '' }));
const BY = Object.fromEntries(COUNTRIES.map(c => [c.c, c]));
// Languages and currencies, named in German by the browser.
const DN = (type, code) => { try { const n = new Intl.DisplayNames('de', { type }).of(code); return n && n !== code ? n : ''; } catch { return ''; } };
for (const c of COUNTRIES) { c.langs = (c.lg || []).map(l => ({ code: l, name: DN('language', l) })).filter(x => x.name); c.curs = (c.cu || []).map(x => ({ code: x, name: DN('currency', x) })).filter(x => x.name); }
const uniq = (arr) => { const m = new Map(); for (const x of arr) if (!m.has(x.code)) m.set(x.code, x); return [...m.values()]; };
const FEATS = topojson.feature(GEO.topo, GEO.topo.objects.countries).features;
// Several features can share an id (e.g. Australia and Ashmore Islands): keep the largest.
const FEAT_BY_ID = new Map();
for (const f of FEATS) { const k = String(f.id), o = FEAT_BY_ID.get(k); if (!o || d3.geoArea(f) > d3.geoArea(o)) FEAT_BY_ID.set(k, f); }
// For zooming, use the biggest polygon so overseas territories do not shrink the country.
const MAIN = new Map();
const mainPart = f => { if (MAIN.has(f)) return MAIN.get(f); let m = f; if (f.geometry.type === 'MultiPolygon') { let best = -1; for (const poly of f.geometry.coordinates) { const g = { type: 'Polygon', coordinates: poly }, a = d3.geoArea(g); if (a > best) { best = a; m = g; } } } MAIN.set(f, m); return m; };
const CODE_BY_ID = new Map(COUNTRIES.filter(c => c.g).map(c => [String(c.g), c.c]));
const featOf = code => { const c = BY[code]; return c && c.g ? FEAT_BY_ID.get(String(c.g)) : null; };
// Neighbours from shared borders in the topology.
const NEIGH = (() => {
  const geoms = GEO.topo.objects.countries.geometries, nb = topojson.neighbors(geoms), out = {};
  geoms.forEach((g, i) => { const a = CODE_BY_ID.get(String(g.id)); if (!a) return; out[a] = nb[i].map(j => CODE_BY_ID.get(String(geoms[j].id))).filter(Boolean); });
  return out;
})();
const flagCache = {};
const flag = code => flagCache[code] || (flagCache[code] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(FLAGS[code] || ''));
const REGION_DE = { Europe: 'Europa', Asia: 'Asien', Africa: 'Afrika', Americas: 'Amerika', Oceania: 'Ozeanien' };
const SUB_DE = {
  'Western Europe': 'Westeuropa', 'Northern Europe': 'Nordeuropa', 'Southern Europe': 'Südeuropa', 'Eastern Europe': 'Osteuropa', 'Central Europe': 'Mitteleuropa', 'Southeast Europe': 'Südosteuropa',
  'Northern Africa': 'Nordafrika', 'Western Africa': 'Westafrika', 'Middle Africa': 'Zentralafrika', 'Eastern Africa': 'Ostafrika', 'Southern Africa': 'Südliches Afrika',
  'North America': 'Nordamerika', 'Central America': 'Mittelamerika', 'Caribbean': 'Karibik', 'South America': 'Südamerika',
  'Western Asia': 'Westasien', 'Central Asia': 'Zentralasien', 'Southern Asia': 'Südasien', 'Eastern Asia': 'Ostasien', 'South-Eastern Asia': 'Südostasien',
  'Australia and New Zealand': 'Australien & Neuseeland', 'Melanesia': 'Melanesien', 'Micronesia': 'Mikronesien', 'Polynesia': 'Polynesien',
};
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const dk = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => dk(new Date());

/* ---------- answer matching ---------- */
const norm = s => String(s).toLowerCase().replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, ' ').trim();
const norm2 = s => norm(String(s).toLowerCase().replace(/ae/g, 'a').replace(/oe/g, 'o').replace(/ue/g, 'u'));
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 3) return 9;
  const m = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) { let prev = m[0]; m[0] = i; for (let j = 1; j <= b.length; j++) { const t = m[j]; m[j] = Math.min(m[j] + 1, m[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; } }
  return m[b.length];
}
// Search index: label shown + all strings that may be typed for it.
const INDEX = {
  country: COUNTRIES.map(c => ({ code: c.c, label: c.n, keys: [c.n, GEO.countries.find(g => g.c === c.c).n, ...((window.ALIASES || {})[c.c] || [])].map(norm) })),
  cap: COUNTRIES.map(c => ({ code: c.c, label: c.k, sub: c.n, keys: [c.k, c.cap, ...(c.c === 'LK' ? ['Colombo'] : c.c === 'SZ' ? ['Lobamba'] : c.c === 'BO' ? ['La Paz'] : c.c === 'ZA' ? ['Kapstadt', 'Bloemfontein'] : [])].filter(Boolean).map(norm) })),
};
INDEX.lang = uniq(COUNTRIES.flatMap(c => c.langs)).map(x => ({ code: x.code, label: x.name, keys: [norm(x.name)] }));
INDEX.cur = uniq(COUNTRIES.flatMap(c => c.curs)).map(x => ({ code: x.code, label: x.name, keys: [norm(x.name), norm(x.name.split(' ').slice(-1)[0])] }));
function search(kind, q) {
  const nq = norm(q), nq2 = norm2(q); if (!nq) return [];
  const out = [];
  for (const it of INDEX[kind]) {
    let best = 9;
    for (const k of it.keys) {
      if (k.startsWith(nq) || k.startsWith(nq2)) best = Math.min(best, 0);
      else if (k.split(' ').some(w => w.startsWith(nq) || w.startsWith(nq2))) best = Math.min(best, 1);
      else if (nq.length >= 3 && (k.includes(nq) || k.includes(nq2))) best = Math.min(best, 2);
      else if (nq.length >= 4) { const d = lev(nq, k.slice(0, Math.max(nq.length, Math.min(k.length, nq.length + 1)))); const tol = nq.length >= 8 ? 2 : 1; if (d <= tol) best = Math.min(best, 3 + d); }
    }
    if (best < 9) out.push({ it, score: best });
  }
  return out.sort((a, b) => a.score - b.score || a.it.label.localeCompare(b.it.label, 'de')).map(x => x.it);
}
// Free text without picking: accept small typos against the target's keys.
function matchesTarget(kind, code, q) {
  const nq = norm(q), it = INDEX[kind].find(x => x.code === code); if (!nq || !it) return false;
  return it.keys.some(k => k === nq || norm2(k) === norm2(q) || (k.length >= 5 && lev(nq, k) <= (k.length >= 9 ? 2 : 1)));
}

/* ---------- progress model ---------- */
const PRESTIGE = [
  { min: 0, name: 'Neu', color: 'var(--surface-2)' }, { min: 1, name: 'Bronze', color: '#B87333' }, { min: 4, name: 'Silber', color: '#A7B0B8' },

    notes.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = ok ? 'sine' : 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.0001, AC.currentTime + i * .09); g.gain.exponentialRampToValueAtTime(.12, AC.currentTime + i * .09 + .02); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + i * .09 + .16); o.connect(g).connect(AC.destination); o.start(AC.currentTime + i * .09); o.stop(AC.currentTime + i * .09 + .18); });

/* ---------- map ---------- */
const W = 600, H = 400;
function centerOf(code) { const f = featOf(code); return f ? d3.geoCentroid(mainPart(f)) : [BY[code].ll[1], BY[code].ll[0]]; }
function radiusOf(code) {
  const f = featOf(code); if (!f) return 0.5;
  const m = mainPart(f), c = d3.geoCentroid(m), b = d3.geoBounds(m);
  let r = 0; for (const p of [[b[0][0], b[0][1]], [b[1][0], b[1][1]], [b[0][0], b[1][1]], [b[1][0], b[0][1]]]) r = Math.max(r, d3.geoDistance(c, p) * 180 / Math.PI);
  return Math.min(r, 40);
}
function makeProjection(code, mode) {
  let center, radius;
  if (mode === 'region') {
    const members = COUNTRIES.filter(c => c.s === BY[code].s);
    center = d3.geoCentroid({ type: 'MultiPoint', coordinates: members.map(c => [c.ll[1], c.ll[0]]) });
    radius = 0; for (const c of members) radius = Math.max(radius, d3.geoDistance(center, [c.ll[1], c.ll[0]]) * 180 / Math.PI);
    radius = Math.max(14, Math.min(radius + 8, 75));
    // jitter so the target is not always in the middle
    center = [center[0] + (Math.random() - .5) * radius * .3, center[1] + (Math.random() - .5) * radius * .2];
  } else { center = centerOf(code); radius = Math.max(7, Math.min(radiusOf(code) * 2.6, 70)); }
  const p = d3.geoOrthographic().rotate([-center[0], -center[1]]).precision(.3);
  p.fitExtent([[12, 12], [W - 12, H - 12]], d3.geoCircle().center(center).radius(radius)());
  return p;
}
function mapSVG(proj, opts = {}) {
  const path = d3.geoPath(proj);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Karte')}"><path class="sphere" d="${path({ type: 'Sphere' })}"/><path class="grat" d="${path(d3.geoGraticule10())}"/>`;
  for (const f of FEATS) {
    const d = path(f); if (!d) continue;
    const code = CODE_BY_ID.get(String(f.id)) || '';
    const cls = ['land']; if (opts.marks && opts.marks[code]) cls.push(opts.marks[code]);
    const fill = opts.fills && opts.fills[code] ? ` style="fill:${opts.fills[code]}"` : '';
    s += `<path class="${cls.join(' ')}" data-c="${code}" d="${d}"${fill}/>`;
  }
  // Capitals as small dots, without names.
  if (window.CAPS && opts.caps !== false) {
    const cp = d3.geoPath(proj).pointRadius(opts.capR || 4.5), tp = d3.geoPath(proj).pointRadius((opts.capR || 4.5) * 1.5);
    for (const c of COUNTRIES) { const ll = CAPS[c.c]; if (!ll) continue; const tgt = opts.marks && opts.marks[c.c] === 'target'; const d = (tgt ? tp : cp)({ type: 'Point', coordinates: [ll[1], ll[0]] }); if (d) s += `<path class="cap${tgt ? ' tcap' : ''}" d="${d}"/>`; }
  }
  for (const [code, kind] of Object.entries(opts.marks || {})) {
    const f = featOf(code); let small = true, pt;
    if (f) { const b = path.bounds(f); small = (b[1][0] - b[0][0]) * (b[1][1] - b[0][1]) < 90; pt = proj(centerOf(code)); }
    else pt = proj([BY[code].ll[1], BY[code].ll[0]]);

// Outline only: the country alone, scaled to fill the frame.
function outlineSVG(code) {

/* ---------- tasks ---------- */
// type: how it is asked. skill: which of the three progress tracks it trains.
const TYPES = {
  flagName: { skill: 'flag', q: () => 'Welches Land hat diese Flagge?', input: 'country', xp: 10 },
  mapName: { skill: 'map', q: () => 'Welches Land ist markiert?', input: 'country', xp: 10 },
  outlineName: { skill: 'map', q: () => 'Welches Land hat diesen Umriss?', input: 'country', xp: 15 },
  mapTap: { skill: 'map', q: c => `Wo liegt ${c.n}? Tippe es auf der Karte an.`, input: 'tap', xp: 15 },
  flagTap: { skill: 'flag', q: () => 'Wo liegt das Land mit dieser Flagge?', input: 'tap', xp: 20 },
  capOf: { skill: 'cap', q: c => `Was ist die Hauptstadt von ${c.n}?`, input: 'cap', xp: 10 },
  capRev: { skill: 'cap', q: c => `${c.k} ist die Hauptstadt von …?`, input: 'country', xp: 15 },
  neighbor: { skill: 'map', q: c => `Nenne ein Nachbarland von ${c.n}.`, input: 'country', xp: 15 },
  currency: { skill: 'cap', q: c => `Mit welcher Währung bezahlt man in ${c.n}?`, input: 'cur', xp: 15 },
  language: { skill: 'cap', q: c => `Nenne eine Amtssprache von ${c.n}.`, input: 'lang', xp: 15 },

function typeFor(code, skill, challenge) {
  const b = isSeen(code) ? cs(code).sk[skill].b : 0;
  if (skill === 'flag') return b >= 3 && Math.random() < .35 ? 'flagTap' : 'flagName';
  if (skill === 'cap') { if (b < 3) return 'capOf'; const o = ['capOf', 'capRev']; if (BY[code].curs.length) o.push('currency'); if (BY[code].langs.length) o.push('language'); return pick(o); }
  if (challenge || b < 2) return 'mapName';
  const opts = ['mapName', 'mapTap'];
  if (b >= 3) opts.push('outlineName', 'mapTap');
  if (b >= 3 && (NEIGH[code] || []).length) opts.push('neighbor');
  return pick(opts);
}
const task = (code, skill, extra = {}) => Object.assign({ code, skill, type: extra.type || typeFor(code, skill, extra.challenge) }, extra);
// Spread tasks of the same country apart.
function spread(list) {
  const out = []; let pool = list.slice();
  while (pool.length) {
    const last = out.slice(-2).map(t => t.code);
    let i = pool.findIndex(t => !last.includes(t.code)); if (i < 0) i = 0;
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}
function newCount(dueN) {
  const a = accuracy(); let n = a >= .9 ? 4 : a >= .78 ? 3 : a >= .6 ? 2 : 1;
  if (dueN >= 12) n = Math.min(n, 1); else if (dueN >= 8) n = Math.min(n, 2);
  return n;
}
function buildRound(mode, region) {
  const now = Date.now(), LEN = 15;
  const inScope = c => !region || c.r === region;
  const due = shuffle(seenList().filter(inScope).flatMap(c => SKILLS.filter(k => cs(c.c).sk[k].d <= now).map(k => task(c.c, k))));
  if (mode === 'hard') {
    const ranked = seenList().filter(inScope).map(c => ({ c: c.c, s: (cs(c.c).w + 1) / (cs(c.c).n + 2) })).sort((a, b) => b.s - a.s).slice(0, 8);
    return spread(shuffle(ranked.flatMap(r => shuffle(SKILLS).slice(0, 2).map(k => task(r.c, k)))).slice(0, LEN));
  }
  if (mode === 'review') return spread(due.length ? due.slice(0, LEN) : shuffle(seenList().filter(inScope).flatMap(c => SKILLS.map(k => task(c.c, k)))).slice(0, LEN));
  const unseen = unseenList().filter(inScope);
  const nNew = Math.min(unseen.length, newCount(due.length));
  // A little randomness: new countries come from the next 10 in order, not strictly the next one.
  const news = shuffle(unseen.slice(0, 10)).slice(0, nNew).map(c => c.c);
  const newTasks = news.flatMap(c => SKILLS.map(k => task(c, k, { isNew: true })));
  const reviews = due.slice(0, Math.max(0, LEN - newTasks.length - 1));
  const list = shuffle([...reviews, ...newTasks]);
  const frontier = unseen.length ? unseen[0].t : 4;
  const pool = unseen.filter(c => c.t >= Math.min(4, frontier + 1) && !news.includes(c.c));
  if (pool.length) list.splice(Math.floor(list.length * .66), 0, task(pick(pool.slice(0, 40)).c, pick(['flag', 'map']), { challenge: true }));
  let seq = spread(list);
  if (seq.length < LEN) { const extra = shuffle(seenList().filter(inScope).flatMap(c => SKILLS.map(k => task(c.c, k)))).filter(t => !seq.some(s => s.code === t.code && s.skill === t.skill)); seq = spread([...seq, ...extra.slice(0, LEN - seq.length)]); }
  return seq;
}
function blitzPool() { const s = seenList(); return (s.length >= 12 ? s : COUNTRIES.filter(c => c.t === 1)).map(c => c.c); }

      <div class="facts"><button class="tag" data-act="capfact" data-c="${code}" style="border:0;cursor:pointer" title="Fakt zur Hauptstadt">🏛️ ${esc(c.k)} ›</button><span class="tag">${esc(SUB_DE[c.s] || c.s)}</span>${c.curs.length ? `<span class="tag">💰 ${esc(c.curs.map(x => x.name).join(', '))}</span>` : ''}</div>
      ${c.langs.length ? `<span class="small muted">🗣️ ${esc(c.langs.map(x => x.name).join(', '))}</span>` : ''}
      ${st.seen ? `<div class="row small" style="gap:6px">${skillDots(code)}<i class="pdot" style="background:${p.color}"></i><span>${p.name} · ${st.n}×${np ? ` · noch ${np.min - st.n} bis ${np.name}` : ''}</span></div>` : ''}
    </div></div>
  <div data-cap="${code}"></div>
  ${nb.length && opts.neighbours !== false ? `<p class="small muted" style="margin:0">Nachbarn: ${esc(nb.join(', '))}</p>` : ''}
  ${opts.fact && c.fact ? `<div class="fact"><b>Fun Fact</b><span>${esc(c.fact)}</span></div>` : ''}`;
}
function infoSheet(code) {
  if (!isSeen(code)) return `<section class="card"><div class="row spread"><h3>Noch nicht entdeckt</h3><button class="link" data-act="close">Schließen</button></div><p class="muted" style="margin:0">Dieses Land taucht in einer späteren Runde auf. Stufe ${BY[code].t} von 4.</p></section>`;
  return `<section class="card" id="sheet"><div class="row spread"><span class="eyebrow">Steckbrief</span><button class="link" data-act="close">Schließen</button></div>${infoCard(code, { fact: true })}</section>`;
}
function renderRound() {
  const R = S.round, it = R.seq[R.i], c = BY[it.code], T = TYPES[it.type];
  const prog = R.mode === 'blitz' ? `<div class="row spread"><span class="mono" id="clock">⏱ ${Math.max(0, Math.ceil((R.end - Date.now()) / 1000))} s</span><span class="mono">${R.okN} richtig</span></div>`
    : R.mode === 'endless' ? `<div class="row spread"><span class="mono">♾️ ${R.okN} in Folge</span><span class="small muted">Bestwert ${ST.best.endless || 0}</span></div>`
    : `<div class="progress">${R.seq.map((x, i) => `<i class="${i < R.i ? (R.res[i] === false ? 'bad' : 'ok') : i === R.i ? 'cur' : ''}"></i>`).join('')}</div>`;
  const head = `<div class="topbar"><button class="link" data-act="quit">✕ Beenden</button><span class="row" style="gap:12px">${R.combo >= 3 ? `<span class="combo">🔥 ${R.combo}</span>` : ''}<span class="xp">+${R.xp} XP</span></span></div>`;
  const tags = [it.challenge ? '<span class="tag challenge">Challenge · +25 XP</span>' : '', it.isNew && !isSeen(it.code) ? '<span class="tag new">Neu</span>' : '', it.retry ? '<span class="tag">Nochmal</span>' : '', `<span class="tag">${SKILL_DE[T.skill]}</span>`].join('');
  let stage = '';
  if (it.type === 'flagName' || it.type === 'flagTap') stage = `<div class="flagbig"><img src="${flag(it.code)}" alt="Flagge"></div>`;
  if (it.type === 'mapName') stage = `<div class="stage">${mapSVG(makeProjection(it.code, 'zoom'), { marks: { [it.code]: 'target' }, pulse: true, label: 'Markiertes Land' })}</div>`;
  if (it.type === 'outlineName') stage = `<div class="stage" style="background:var(--surface-2)">${outlineSVG(it.code)}</div>`;
  if (it.type === 'mapTap' || it.type === 'flagTap') stage += `<div class="stage ${R.answered ? '' : 'clickable'}" id="clickmap">${mapSVG(R.proj, { marks: R.answered ? answerMarks(it) : {}, label: 'Karte zum Antippen' })}</div>`;
  if ((it.type === 'capOf' || it.type === 'capRev' || it.type === 'neighbor' || it.type === 'currency' || it.type === 'language') && !R.answered) stage = `<div class="flagbig" style="padding:14px"><img src="${flag(it.code)}" alt="" style="width:min(160px,50%)"></div>`;
  if (it.type === 'capRev' && !R.answered) stage = '';
  let input = '';
  if (!R.answered && T.input !== 'tap') {
    input = `<div class="ac"><input id="guess" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="${({ cap: 'Hauptstadt', cur: 'Währung', lang: 'Sprache' })[T.input] || 'Land'} eintippen …" aria-label="Antwort">
      <div class="aclist" id="aclist" role="listbox"></div>
      <div class="row spread"><span class="hint" id="achint">Erste Buchstaben tippen, Enter wählt den obersten Vorschlag.</span><button class="link" data-act="skip">Weiß ich nicht</button></div></div>`;
  }
  let fb = '';
  if (R.answered) {
    const ok = R.ok, st = cs(it.code), p = prestigeOf(st.n);
    const given = R.givenLabel ? `Deine Antwort: ${esc(R.givenLabel)}. ` : '';
    const solution = it.type === 'currency' ? `Währung in ${esc(c.n)}: <b>${esc(c.curs.map(x => x.name).join(', '))}</b>` : it.type === 'language' ? `Amtssprachen in ${esc(c.n)}: <b>${esc(c.langs.map(x => x.name).join(', '))}</b>` : it.type === 'capOf' || it.type === 'capRev' ? `Hauptstadt von ${esc(c.n)}: <button class="link" data-act="capfact" data-c="${it.code}" style="padding:0;color:var(--ink);font-weight:700;text-decoration:underline dotted">${esc(c.k)}</button>` : it.type === 'neighbor' ? `Nachbarn von ${esc(c.n)}: <b>${esc((NEIGH[it.code] || []).map(x => BY[x].n).join(', '))}</b>` : `Das war <b>${esc(c.n)}</b>`;
    const showFact = !ok || R.firstMeet;
    fb = `<div class="fb ${ok ? 'ok' : 'bad'}"><div class="grow" style="display:grid;gap:2px">
        <b>${ok ? 'Richtig!' + (R.speedBonus ? ' ⚡ schnell' : '') : 'Leider nicht'}</b>
        <span class="small">${ok ? (it.type === 'neighbor' && R.givenLabel ? esc(R.givenLabel) + ' grenzt an ' + esc(c.n) + '.' : solution) : given + solution}</span>
        <span class="small row" style="gap:6px">${skillDots(it.code)}<i class="pdot" style="background:${p.color}"></i>${p.name} · ${st.n}×</span></div>
        ${ok ? `<span class="xp">+${R.lastXP}</span>` : ''}</div>
      ${!ok || R.firstMeet ? `<section class="card">${infoCard(it.code, { fact: showFact, marks: answerMarks(it) })}</section>` : `<div class="row" style="gap:14px"><button class="link" data-act="fact">💡 Fun Fact</button><button class="link" data-act="capfact" data-c="${it.code}">🏛️ ${esc(c.k)}</button></div><div id="factbox"></div><div data-cap="${it.code}"></div>`}
      <button class="btn primary big" data-act="next" id="next">Weiter</button>`;
  }
  app.innerHTML = `${head}${prog}<div class="row" style="gap:6px;flex-wrap:wrap">${tags}</div><div class="q">${esc(T.q(c))}</div>${R.answered && (it.type === 'mapName' || it.type === 'outlineName' || it.type === 'flagName') && !R.ok ? '' : stage}${input}${fb}`;
  if (!R.answered && T.input !== 'tap') { const g = document.getElementById('guess'); g.focus(); R.qStart = R.qStart || Date.now(); }
  else if (!R.answered) R.qStart = R.qStart || Date.now();
  if (R.answered) document.getElementById('next')?.focus();
}
function answerMarks(it) {
  const m = { [it.code]: 'target' };
  const R = S.round; if (R.given && R.given !== it.code && BY[R.given] && TYPES[it.type].input !== 'cap') m[R.given] = 'wrong';
  return m;
}
function renderAc() {
  const R = S.round, it = R.seq[R.i], T = TYPES[it.type], g = document.getElementById('guess'), list = document.getElementById('aclist'); if (!g || !list) return;
  const res = search(T.input, g.value); R.acList = res; R.acSel = Math.min(R.acSel || 0, Math.max(0, res.length - 1));
  const q = norm(g.value);
  list.innerHTML = res.slice(0, 60).map((x, i) => `<button class="${i === R.acSel ? 'on' : ''}" data-act="pick" data-v="${x.code}" role="option"><span>${hl(x.label, q)}</span>${x.sub && T.input === 'cap' ? '' : ''}</button>`).join('');
  document.getElementById('achint').textContent = g.value && !res.length ? 'Kein Treffer. Enter prüft trotzdem, kleine Tippfehler zählen.' : res.length > 60 ? res.length + ' Treffer, tippe weiter' : 'Erste Buchstaben tippen, Enter wählt den obersten Vorschlag.';
}
function hl(label, q) { if (!q) return esc(label); const i = norm(label).indexOf(q); return i === 0 ? `<mark>${esc(label.slice(0, q.length))}</mark>${esc(label.slice(q.length))}` : esc(label); }
function renderDone() {
  const R = S.round, okN = R.res.filter(x => x === true).length, qN = R.res.filter(x => x !== undefined).length, lv = levelOf(ST.xp);
  const title = R.mode === 'blitz' ? `⚡ ${R.okN} in 60 s` : R.mode === 'endless' ? `♾️ ${R.okN} in Folge` : `+${R.xp} XP`;
  const sub = R.mode === 'blitz' || R.mode === 'endless' ? `${R.newBest ? 'Neuer Bestwert! · ' : ''}+${R.xp} XP · Level ${lv.l}` : `${okN} von ${qN} richtig${R.perfect ? ' · fehlerfrei, +30 XP' : ''} · Level ${lv.l}`;
  const miss = [...new Map(R.mistakes.map(m => [m.code + m.skill, m])).values()];
  app.innerHTML = `${topBar('echo')}
  <section class="card" style="text-align:center;justify-items:center"><span class="eyebrow">Runde geschafft</span><div class="big-num">${title}</div><p class="muted" style="margin:0">${sub}</p></section>
  ${R.badges.length ? `<section class="card"><h3>Neue Abzeichen</h3><div class="row" style="flex-wrap:wrap;gap:8px">${R.badges.map(b => `<span class="tag challenge">${esc(b)}</span>`).join('')}</div></section>` : ''}
  ${miss.length ? `<section class="card"><h3>Das solltest du dir merken</h3><div style="display:grid;gap:10px">${miss.map(m => { const c = BY[m.code]; return `<div class="row"><img src="${flag(m.code)}" alt="" style="width:44px;aspect-ratio:4/3;border-radius:4px;object-fit:cover"><div class="grow" style="display:grid"><b>${esc(c.n)}</b><span class="small muted">${m.skill === 'cap' ? 'Hauptstadt: ' + esc(c.k) : m.skill === 'flag' ? 'Flagge' : 'Lage: ' + esc(SUB_DE[c.s] || c.s)}</span></div></div>`; }).join('')}</div></section>` : ''}
  ${R.newOnes.length ? `<section class="card"><h3>Neu entdeckt</h3><div class="row" style="flex-wrap:wrap;gap:8px">${R.newOnes.map(c => `<span class="tag new">${esc(BY[c].n)}</span>`).join('')}</div></section>` : ''}
  ${R.ups.length ? `<section class="card"><h3>Aufgestiegen</h3><div style="display:grid;gap:8px">${R.ups.map(([c, p]) => `<div class="row"><img src="${flag(c)}" alt="" style="width:40px;aspect-ratio:4/3;border-radius:4px;object-fit:cover"><span class="grow">${esc(BY[c].n)}</span><span class="row small" style="gap:6px"><i class="pdot" style="background:${p.color}"></i>${p.name}</span></div>`).join('')}</div></section>` : ''}
  <button class="btn primary big" data-act="${R.mode === 'learn' ? 'start' : R.mode}" id="again">Nochmal</button>
  <div class="row" style="gap:8px"><button class="btn grow" data-act="home">Übersicht</button><button class="btn grow" data-act="collection">Sammlung</button></div>`;
  document.getElementById('again').focus();
}

/* ---------- round flow ---------- */
function startRound(mode) {
  let seq;
  if (mode === 'blitz' || mode === 'endless') seq = [];
  else seq = buildRound(mode, S.region);
  if (mode !== 'blitz' && mode !== 'endless' && !seq.length) { toast('Nichts zu wiederholen'); return; }
  S.round = { mode, seq, i: 0, res: [], xp: 0, combo: 0, okN: 0, answered: false, mistakes: [], newOnes: [], ups: [], badges: [], retried: new Set(), lastXP: 0 };
  if (mode === 'blitz') { S.round.end = Date.now() + 60e3; S.round.timer = setInterval(() => { const el = document.getElementById('clock'); const left = Math.ceil((S.round.end - Date.now()) / 1000); if (left <= 0) { clearInterval(S.round.timer); finish(); } else if (el) el.textContent = '⏱ ' + left + ' s'; }, 250); }
  if (mode === 'blitz' || mode === 'endless') pushQuick();
  prepItem(); S.view = 'round'; render(); scrollTo(0, 0);
}
function pushQuick() {
  const R = S.round, pool = R.mode === 'blitz' ? blitzPool() : COUNTRIES.filter(c => isSeen(c.c) || c.t <= 2).map(c => c.c);
  const last = R.seq.slice(-6).map(t => t.code);
  const code = pick(pool.filter(c => !last.includes(c)) .length ? pool.filter(c => !last.includes(c)) : pool);
  const skill = R.mode === 'blitz' ? pick(['flag', 'map']) : pick(SKILLS);
  R.seq.push(task(code, skill, { type: R.mode === 'blitz' ? (skill === 'flag' ? 'flagName' : 'mapName') : undefined }));
}
function prepItem() {
  const R = S.round, it = R.seq[R.i];
  Object.assign(R, { answered: false, given: null, givenLabel: '', ok: false, acSel: 0, acList: [], qStart: 0, speedBonus: false, firstMeet: false });
  if (it && (it.type === 'mapTap' || it.type === 'flagTap')) R.proj = makeProjection(it.code, 'region');
}
function answer(givenCode, typed) {
  const R = S.round, it = R.seq[R.i], T = TYPES[it.type]; if (R.answered) return;
  let ok;
  const listOf = it.type === 'currency' ? BY[it.code].curs : it.type === 'language' ? BY[it.code].langs : null;
  if (listOf) ok = (!!givenCode && listOf.some(x => x.code === givenCode)) || (!givenCode && !!typed && listOf.some(x => { const k = norm(x.name), q = norm(typed); return k === q || (k.length >= 5 && lev(q, k) <= 1); }));
  else if (it.type === 'neighbor') ok = !!givenCode && (NEIGH[it.code] || []).includes(givenCode) || (!givenCode && typed && (NEIGH[it.code] || []).some(n => matchesTarget('country', n, typed)));
  else ok = givenCode === it.code || (!givenCode && typed != null && matchesTarget(T.input === 'cap' ? 'cap' : 'country', it.code, typed));
  R.answered = true; R.ok = ok; R.given = givenCode;
  R.givenLabel = givenCode ? (T.input === 'cap' ? BY[givenCode].k : T.input === 'cur' || T.input === 'lang' ? ((INDEX[T.input].find(x => x.code === givenCode) || {}).label || givenCode) : BY[givenCode].n) : (typed || '');
  const st = cs(it.code), sk = st.sk[it.skill], now = Date.now(), d = dayRec();
  R.firstMeet = !st.seen;
  st.seen = st.seen || now; d.q++;
  ST.hist.push(ok); if (ST.hist.length > 200) ST.hist = ST.hist.slice(-200);
  if (ok) {
    const before = prestigeOf(st.n);
    st.n++; sk.b = Math.min(INTERVALS.length - 1, sk.b + 1); sk.d = now + INTERVALS[sk.b];
    R.combo++; R.okN++; ST.best.combo = Math.max(ST.best.combo || 0, R.combo);
    let xp = it.challenge ? 25 : T.xp;
    if (R.combo >= 3) xp += Math.min(10, 2 * (R.combo - 2));
    const secs = (now - (R.qStart || now)) / 1000;
    if (T.input !== 'tap' && secs < 6) { xp += secs < 3.5 ? 5 : 3; R.speedBonus = true; }
    if (R.firstMeet) xp += 10;
    R.xp += xp; R.lastXP = xp; ST.xp += xp; d.xp += xp; d.ok++;
    const after = prestigeOf(st.n);
    if (after !== before) { R.ups = R.ups.filter(u => u[0] !== it.code); R.ups.push([it.code, after]); toast(`${BY[it.code].n}: ${after.name}!`); }
  } else {
    st.w++; sk.b = sk.b > 1 ? 1 : 0; sk.d = now; R.combo = 0;
    R.mistakes.push({ code: it.code, skill: it.skill });
    if (R.mode !== 'blitz' && R.mode !== 'endless' && !R.retried.has(it.code + it.skill)) { R.retried.add(it.code + it.skill); R.seq.splice(Math.min(R.seq.length, R.i + 4), 0, task(it.code, it.skill, { retry: true, type: it.type === 'mapTap' || it.type === 'flagTap' || it.type === 'neighbor' || it.type === 'outlineName' ? (it.skill === 'flag' ? 'flagName' : 'mapName') : it.type })); }
  }
  if (R.firstMeet && !R.newOnes.includes(it.code)) R.newOnes.push(it.code);
  R.res[R.i] = ok; beep(ok); save();
  if (R.mode === 'blitz') { if (!ok) R.flash = true; nextQuick(); return; }
  render();
}
function nextQuick() { const R = S.round; R.i++; pushQuick(); prepItem(); render(); }
function next() {
  const R = S.round;
  if (R.mode === 'endless') { if (!R.ok) return finish(); R.i++; pushQuick(); prepItem(); render(); scrollTo(0, 0); return; }
  R.i++;
  if (R.i >= R.seq.length) return finish();
  prepItem(); render(); scrollTo(0, 0);
}
function finish() {
  const R = S.round, d = dayRec(); if (R.done) return; R.done = true;
  clearInterval(R.timer);
  if (R.mode === 'blitz') { if (R.okN > (ST.best.blitz || 0)) { ST.best.blitz = R.okN; R.newBest = true; } }
  if (R.mode === 'endless') { if (R.okN > (ST.best.endless || 0)) { ST.best.endless = R.okN; R.newBest = true; } }
  const qs = R.res.filter(x => x !== undefined);
  if (R.mode !== 'blitz' && R.mode !== 'endless' && qs.length >= 8 && qs.every(Boolean)) { R.perfect = true; ST.best.perfect = 1; R.xp += 30; ST.xp += 30; d.xp += 30; }
  if (qs.length) d.r++;
  R.badges = checkBadges(); save();
  S.view = 'done'; render(); scrollTo(0, 0);
}
function submitTyped() {
  const R = S.round, g = document.getElementById('guess'); if (!g) return;
  const sel = (R.acList || [])[R.acSel || 0];
  if (!g.value.trim()) { g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); return; }
  // Typed text that already matches the target (with small typos) wins over the list's first entry.
  const it = R.seq[R.i], T = TYPES[it.type];
  if (!['neighbor', 'currency', 'language'].includes(it.type) && matchesTarget(T.input === 'cap' ? 'cap' : 'country', it.code, g.value)) return answer(it.code);
  if (sel) return answer(sel.code);
  answer(null, g.value);
}

/* ---------- events ---------- */
app.addEventListener('input', e => { if (e.target.id === 'guess') { S.round.acSel = 0; renderAc(); } });
app.addEventListener('keydown', e => {
  if (e.target.id !== 'guess') return;
  const R = S.round;
  if (e.key === 'ArrowDown') { e.preventDefault(); R.acSel = Math.min((R.acList || []).length - 1, (R.acSel || 0) + 1); renderAc(); document.querySelector('.aclist .on')?.scrollIntoView({ block: 'nearest' }); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); R.acSel = Math.max(0, (R.acSel || 0) - 1); renderAc(); document.querySelector('.aclist .on')?.scrollIntoView({ block: 'nearest' }); }
  else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); submitTyped(); }
});
app.addEventListener('click', e => {
  const mapEl = e.target.closest('#clickmap');
  if (mapEl && S.view === 'round' && !S.round.answered) {
    const it = S.round.seq[S.round.i], land = e.target.closest('.land');
    const svg = mapEl.querySelector('svg'), r = svg.getBoundingClientRect(), sx = W / r.width;
    const x = (e.clientX - r.left) * sx, y = (e.clientY - r.top) * sx;
    const f = featOf(it.code), pt = S.round.proj(centerOf(it.code));
    const near = pt && Math.hypot(pt[0] - x, pt[1] - y) < 24;
    const code = land ? land.dataset.c : '';
    if (code === it.code || (near && (!code || (BY[code] && BY[code].a > 5 * (BY[it.code].a || 1))))) return answer(it.code);
    if (land) return answer(code || null, code ? undefined : '');
    return;
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'start') startRound('learn');
  else if (['review', 'hard', 'blitz', 'endless'].includes(a)) startRound(a);
  else if (a === 'region') { S.region = b.dataset.v || null; render(); }
  else if (a === 'collection') { S.view = 'collection'; S.sheet = null; render(); scrollTo(0, 0); }
  else if (a === 'badges') { S.view = 'badges'; render(); scrollTo(0, 0); }
  else if (a === 'home') { S.view = 'home'; render(); scrollTo(0, 0); }
  else if (a === 'sound') { ST.sound = !ST.sound; save(); render(); }
  else if (a === 'quit') { clearInterval(S.round.timer); if (S.round.res.length) finish(); else { S.view = 'home'; render(); } }
  else if (a === 'pick') answer(b.dataset.v);
  else if (a === 'skip') answer(null, '');
  else if (a === 'next') next();
  else if (a === 'capfact') {
    const code = b.dataset.c, c = BY[code], f = (window.CAPFACTS || {})[code];
    document.querySelectorAll(`[data-cap="${code}"]`).forEach(box => { box.innerHTML = box.innerHTML ? '' : `<div class="fact"><b>🏛️ ${esc(c.k)}</b><span>${esc(f || 'Hauptstadt von ' + c.n + '.')}</span></div>`; });
  }
  else if (a === 'fact') { const c = BY[S.round.seq[S.round.i].code]; const box = document.getElementById('factbox'); if (box) box.innerHTML = `<div class="fact"><b>Fun Fact</b><span>${esc(c.fact)}</span></div>`; b.remove(); }
  else if (a === 'filter') { S.filter = b.dataset.v; S.sheet = null; render(); }
  else if (a === 'info') { S.sheet = b.dataset.c; render(); document.getElementById('sheet')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (a === 'close') { S.sheet = null; render(); }
});
document.addEventListener('keydown', e => {
  if (S.view !== 'round' || e.target.id === 'guess') return;
  if ((e.key === 'Enter' || e.key === ' ') && S.round.answered) { e.preventDefault(); next(); }
});
render();
</script>
