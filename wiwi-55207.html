.phase{display:flex;gap:4px}

.sv{background:var(--surface-2);border-radius:12px;padding:12px 14px;line-height:1.55}

.mod{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mod.lock{opacity:.5}
.why{border-left:3px solid var(--gold);padding-left:12px;line-height:1.55}
details summary{cursor:pointer;font-weight:600}
.askov{position:fixed;inset:0;z-index:60;background:rgba(10,14,12,.55);display:grid;place-items:end center;padding:10px}
.askbox{width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--bg);border-radius:22px;padding:16px;display:grid;gap:10px}
.askq{justify-self:end;max-width:88%;background:var(--surface-2);border-radius:14px 14px 4px 14px;padding:9px 12px;line-height:1.45}
.aska{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px;line-height:1.55}
.askbox textarea{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
