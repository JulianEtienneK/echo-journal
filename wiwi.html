<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Echo WiWi</title>
<meta name="theme-color" content="#F2F3EF">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="tools.css">
<script src="theme.js"></script>
<script src="kurator.js"></script>
<script src="eule.js" defer></script>
<link rel="stylesheet" href="theme.css">
<style>
.big{font-size:28px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:90px}
.days div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.stackbar{display:flex;flex-direction:column-reverse;width:100%;border-radius:6px 6px 2px 2px;overflow:hidden;min-height:3px}
.stackbar i{display:block;width:100%;min-height:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i,.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.tmr{display:grid;gap:10px;padding:12px;border-radius:14px;background:var(--surface-2,rgba(127,127,127,.08))}
.tmr.on{outline:2px solid var(--calm)}
.tmr .timer{font:700 26px var(--f-mono,monospace)}
.days span{font-size:11px;color:var(--muted)}
.timer{font:600 44px var(--f-mono);text-align:center;letter-spacing:1px}
#app select,#app input[type=number]{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
</style>
</head>
<body>
<main id="app"></main>
<script src="tools-common.js"></script>
<script src="wiwi-common.js"></script>
<script src="wiwi.js"></script>
</body>
</html>
