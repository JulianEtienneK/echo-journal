<head>

<style>
/* Atlas-Duell. One column like Echo Atlas: question on top, map or picture as the stage, answers below. */
:root {
  --bg: #F2F3EF; --surface: #FFFFFF; --surface-2: #E7EAE4; --ink: #1A1E1C; --muted: #5C6661; --line: #D5DAD3;
  --calm: #1B8173; --calm-soft: rgba(27,129,115,.12); --rec: #D4542A; --rec-soft: rgba(212,84,42,.12);
  --gold: #A87D14; --gold-soft: rgba(184,138,30,.16);
  --ocean: #DCE6E8; --land: #C9CFC6; --land-line: #F7F8F5; --target: #1B8173;
  --shadow: 0 1px 2px rgba(20,30,25,.05), 0 10px 28px rgba(20,30,25,.07);
  --f-display: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 18px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1211; --surface: #171B19; --surface-2: #212624; --ink: #E8ECE7; --muted: #95A09A; --line: #2A312E;
  --calm: #3DC2AD; --calm-soft: rgba(61,194,173,.14); --rec: #FF7647; --rec-soft: rgba(255,118,71,.15);
  --gold: #E5B84C; --gold-soft: rgba(229,184,76,.15);
  --ocean: #142024; --land: #34403B; --land-line: #171B19; --target: #3DC2AD;
  --shadow: 0 1px 0 rgba(255,255,255,.03); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F1211; --surface: #171B19; --surface-2: #212624; --ink: #E8ECE7; --muted: #95A09A; --line: #2A312E;
  --calm: #3DC2AD; --calm-soft: rgba(61,194,173,.14); --rec: #FF7647; --rec-soft: rgba(255,118,71,.15);
  --gold: #E5B84C; --gold-soft: rgba(229,184,76,.15);
  --ocean: #142024; --land: #34403B; --land-line: #171B19; --target: #3DC2AD;
  --shadow: 0 1px 0 rgba(255,255,255,.03); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--calm); outline-offset: 2px; border-radius: 8px; }
#app { max-width: 600px; margin: 0 auto; display: grid; gap: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 40px); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 32px; font-weight: 700; letter-spacing: -.02em; }
h2 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; } .spread { justify-content: space-between; } .grow { flex: 1; min-width: 0; } .wrap { flex-wrap: wrap; }
.btn { border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 700; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.primary { background: var(--calm); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0F1211; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0F1211; } }
.btn.big { padding: 17px 20px; font-size: 18px; width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.link { background: none; border: 0; padding: 6px 0; color: var(--muted); font-weight: 500; white-space: nowrap; text-decoration: none; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 13px; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.field { width: 100%; font: 700 17px/1.3 var(--f-body); padding: 13px 15px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.field:focus { outline: none; border-color: var(--calm); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.tag.gold { background: var(--gold-soft); color: var(--gold); } .tag.calm { background: var(--calm-soft); color: var(--calm); }
.hero { display: grid; gap: 6px; padding-top: 6px; }
.hero h1 span { color: var(--calm); }
.mode { border: 0; text-align: left; width: 100%; }
.mode .row > .em { font-size: 30px; flex: none; }
/* round */
.progress { display: flex; gap: 4px; } .progress i { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); }
.progress i.g { background: var(--calm); } .progress i.y { background: var(--gold); } .progress i.r { background: var(--rec); } .progress i.cur { background: var(--ink); opacity: .45; }
.tbar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; } .tbar i { display: block; height: 100%; width: 100%; background: var(--gold); border-radius: 99px; }
.tbar.low i { background: var(--rec); }
.q { font-family: var(--f-display); font-size: 23px; font-weight: 700; text-wrap: balance; line-height: 1.2; }
.stage { position: relative; background: var(--ocean); border-radius: var(--r); overflow: hidden; aspect-ratio: 3 / 2; touch-action: none; }
.stage svg { width: 100%; height: 100%; display: block; }
.stage .sphere { fill: var(--ocean); }
.stage .land { fill: var(--land); stroke: var(--land-line); stroke-width: .6; vector-effect: non-scaling-stroke; }
.stage .land.target { fill: var(--target); }
.stage .land.won { stroke: var(--surface); stroke-width: 1; }
.stage .line { fill: none; stroke-width: 2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.stage .pin path { stroke: #fff; stroke-width: 1.5; }
.stage .pin circle { fill: #fff; }
.stage .tmark circle:not(.wdot) { fill: var(--target); stroke: #fff; stroke-width: 2; }
.stage .tmark path { fill: #fff; }
.stage .plabel { font: 700 11px var(--f-body); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.zoomctl { position: absolute; right: 8px; top: 8px; display: grid; gap: 6px; }
.zoomctl button { width: 38px; height: 38px; border-radius: 12px; border: 0; background: var(--surface); box-shadow: var(--shadow); font-weight: 700; font-size: 18px; }
.drop { animation: drop .45s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-18px); } }
.flagbig { display: grid; place-items: center; background: var(--surface-2); border-radius: var(--r); padding: 22px; }
.flagbig img { width: min(320px, 80%); aspect-ratio: 4 / 3; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.18); object-fit: cover; }
.shapebox { background: var(--surface-2); border-radius: var(--r); aspect-ratio: 3 / 2; } .shapebox svg { width: 100%; height: 100%; display: block; } .shapebox path { fill: var(--target); }
.fact { background: var(--gold-soft); border-radius: 14px; padding: 14px 16px; font-size: 17px; line-height: 1.45; display: flex; gap: 10px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opts.one { grid-template-columns: 1fr; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 12px; font-weight: 700; text-align: left; display: flex; gap: 10px; align-items: center; min-width: 0; min-height: 56px; touch-action: manipulation; }
.opt img { width: 46px; aspect-ratio: 4 / 3; border-radius: 4px; object-fit: cover; flex: none; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.opt.duo { flex-direction: column; text-align: center; padding: 16px 10px; }
.opt.duo img { width: 80%; max-width: 140px; }
.opt.ok { border-color: var(--calm); background: var(--calm-soft); } .opt.bad { border-color: var(--rec); background: var(--rec-soft); }
.opt.gone { display: none; }
.opt:disabled { cursor: default; }
.jokers { display: flex; gap: 8px; }
.joker { flex: 1; border: 1px dashed var(--line); background: transparent; border-radius: 12px; padding: 8px 6px; font-size: 13px; font-weight: 700; display: grid; justify-items: center; gap: 0; }
.joker small { font-weight: 500; color: var(--muted); font-size: 11px; }
.joker.on { border-style: solid; border-color: var(--gold); background: var(--gold-soft); color: var(--gold); }
.joker:disabled { opacity: .32; cursor: default; }
.joker.on:disabled { opacity: 1; }
.hintbar { background: var(--gold-soft); color: var(--ink); border-radius: 12px; padding: 9px 12px; font-size: 14px; }
.slider { display: grid; gap: 10px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px 18px; }
.slider input { width: 100%; accent-color: var(--calm); height: 30px; touch-action: none; }
.slider .val { font-family: var(--f-display); font-weight: 700; font-size: 38px; text-align: center; line-height: 1; }
.scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--f-mono); }
/* feedback */
.gain { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.gain .pts { font-family: var(--f-display); font-size: 46px; font-weight: 700; line-height: 1; color: var(--calm); }
.gain .pts.zero { color: var(--rec); }
.bonus { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.answer { display: flex; gap: 14px; align-items: center; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); padding: 14px 16px; }
.answer img { width: 64px; aspect-ratio: 4 / 3; border-radius: 5px; object-fit: cover; flex: none; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.answer b { font-family: var(--f-display); font-size: 19px; }
/* boards */
.board { display: grid; gap: 6px; }
.brow { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; background: var(--surface); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); }
.brow.me { box-shadow: inset 0 0 0 2px var(--calm), var(--shadow); }
.brow .rk { font-family: var(--f-mono); color: var(--muted); text-align: center; }
.brow .nm { font-weight: 700; display: flex; gap: 8px; align-items: center; min-width: 0; }
.brow .nm > span { display: grid; min-width: 0; }
.brow .nm b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .sub { font-size: 12px; color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage .wdot { fill-opacity: .95; stroke: #fff; stroke-width: 1.5; }
.brow .tot { font-family: var(--f-mono); font-weight: 500; }
.brow .delta { font-family: var(--f-mono); font-size: 12px; min-width: 34px; text-align: right; }
.delta.up { color: var(--calm); } .delta.down { color: var(--rec); }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.handoff { min-height: 62vh; display: grid; place-items: center; text-align: center; gap: 14px; align-content: center; }
.handoff .who { font-family: var(--f-display); font-size: 44px; font-weight: 700; line-height: 1.05; }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 8px; text-align: center; padding-top: 10px; }
.podium .col { display: grid; gap: 6px; justify-items: center; min-width: 0; }
.podium .nm { font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podium .blk { width: 100%; border-radius: 12px 12px 4px 4px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 26px; color: #fff; animation: rise .7s cubic-bezier(.2, 1.2, .4, 1) both; }
.podium .p1 .blk { height: 120px; background: var(--gold); animation-delay: .5s; } .podium .p2 .blk { height: 86px; background: #8D9692; animation-delay: .25s; } .podium .p3 .blk { height: 64px; background: #B07A4A; }
@keyframes rise { from { transform: scaleY(0); transform-origin: bottom; } }
.awards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.award { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; display: grid; gap: 2px; }
.award .em { font-size: 22px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.emojirow { font-size: 20px; letter-spacing: 2px; text-align: center; }
.big-num { font-family: var(--f-display); font-size: 54px; font-weight: 700; line-height: 1; }
.names { display: grid; gap: 8px; }
.nrow { display: flex; gap: 8px; align-items: center; }
.nrow .field { padding: 10px 13px; font-size: 16px; }
.nrow button { border: 0; background: var(--surface-2); border-radius: 12px; width: 44px; height: 44px; flex: none; font-size: 18px; }
details.rules { background: var(--surface); border-radius: var(--r); padding: 14px 18px; box-shadow: var(--shadow); }
details.rules summary { font-weight: 700; cursor: pointer; }
details.rules ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 20; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; animation: pop .25s ease-out; }
@keyframes pop { from { transform: translate(-50%, 10px); opacity: 0; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
.sharebox { width: 100%; font: 400 13px var(--f-mono); padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }

/* bomb */
.lives { display: flex; flex-wrap: wrap; gap: 6px; }
.lchip { display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 99px; background: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 700; }
.lchip.cur { box-shadow: inset 0 0 0 2px currentColor, var(--shadow); }
.lchip.out { opacity: .4; text-decoration: line-through; }
.bcat { text-align: center; justify-items: center; gap: 4px; }
.bcat .q { font-size: 25px; }
.bombzone { display: grid; justify-items: center; gap: 8px; position: relative; padding: 4px 0; }
.bomb { font-size: 80px; line-height: 1; }
.bomb.hot { animation: wobble .3s infinite; }
.bomb.hotter { animation: wobble .12s infinite; filter: drop-shadow(0 0 14px var(--rec)); }
@keyframes wobble { 25% { transform: rotate(-9deg) scale(1.06); } 75% { transform: rotate(9deg) scale(1.06); } }
.fuse { width: 100%; height: 12px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.fuse i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--rec), var(--gold)); border-radius: 99px; }
.bsec { font-size: 15px; color: var(--muted); }
.bpass { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); font-family: var(--f-display); font-size: 25px; font-weight: 700; text-align: center; line-height: 1.25; animation: pop .2s ease-out; }
.bwho { font-family: var(--f-display); font-size: 28px; font-weight: 700; text-align: center; line-height: 1.1; }
#bform { display: flex; gap: 8px; }
#bform .field { flex: 1; min-width: 0; }
.bsug { display: flex; flex-wrap: wrap; gap: 6px; }
.bmsg { min-height: 22px; font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bmsg.bad { color: var(--rec); } .bmsg.ok { color: var(--calm); }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
.boomscr { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 18px 0 6px; }
.boomscr .em { font-size: 100px; line-height: 1; animation: boomIn .55s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes boomIn { from { transform: scale(.2) rotate(-30deg); opacity: 0; } }
.flash { animation: flash .7s ease-out; }
@keyframes flash { 0% { background: var(--rec); } }

/* online */
.roomcode { font-family: var(--f-mono); font-size: 44px; font-weight: 500; letter-spacing: .18em; text-align: center; color: var(--calm); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); border-radius: 14px; padding: 4px; }
.seg button { border: 0; border-radius: 11px; padding: 10px; font-weight: 700; background: transparent; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); }
.ptyping { min-height: 46px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 20px; color: var(--muted); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 8px; }
.yourturn { animation: pulseTurn 1s ease-in-out infinite; }
@keyframes pulseTurn { 50% { opacity: .55; } }
.odot { width: 8px; height: 8px; border-radius: 50%; background: var(--calm); display: inline-block; }
.odot.off { background: var(--rec); }
.hintbig { background: var(--gold-soft); border-radius: 14px; padding: 12px 14px; font-size: 17px; text-align: center; }
.hintbig b { font-family: var(--f-mono); font-size: 22px; letter-spacing: .08em; }
.helpcard { border: 2px dashed var(--gold); }
#hform { display: flex; gap: 8px; }
#hform .field { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: .2em; font-family: var(--f-mono); }
.glass { width: 140px; height: 190px; }
.glass .milk { transition: y .12s ease-out, height .12s ease-out; }
.shakebtn { width: 100%; min-height: 120px; border-radius: var(--r); border: 2px dashed var(--line); background: var(--surface); font-size: 18px; font-weight: 700; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.shakebtn:active { transform: scale(.98); }
.sbar { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 10fr) 44px; gap: 8px; align-items: center; font-size: 13px; }
.sbar .tr { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; } .sbar .tr i { display: block; height: 100%; border-radius: 99px; }
.wob { animation: wob .18s; } @keyframes wob { 50% { transform: rotate(-12deg) scale(1.08); } }
.countdown { font-family: var(--f-display); font-size: 72px; font-weight: 700; line-height: 1; }
@media (max-width: 380px) { .opts:not(.duo2) { grid-template-columns: 1fr; } }

<body>
<main id="app"><p class="muted" style="padding:60px 0;text-align:center">Lade die Welt …</p></main>
<script src="geo/d3.min.js"></script>
<script src="geo/topojson-client.min.js"></script>
<script src="geo/data.js"></script>
<script src="geo/flags.js"></script>
<script src="geo/facts.js"></script>
<script src="geo/caps.js"></script>
<script>
'use strict';
/* Atlas-Duell: ten mixed geography rounds for friends. Every question comes from one seed, so a link gives everyone the same
   game. Modes: daily duel, challenge link (results travel inside the URL and pile up into a leaderboard, no server), party on
   one phone (pass it around, then a joint reveal). Extras: three jokers per player, a double final, streak bonus, titles,
   a map of round winners. Progress lives in localStorage 'echo-duell'. */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const fmt = n => Math.round(n).toLocaleString('de-DE');
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function toast(msg) { document.querySelectorAll('.toast').forEach(t => t.remove()); const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
